  /api/terminal/sessions:
    get:
      summary: アクティブなターミナルセッション一覧
      description: |
        ログイン中のユーザーに属するアクティブなターミナルセッション一覧を返します。
        レジューム時は、返却された session_id を GET /ws/ssh?session_id={id} に渡して再接続します（認証情報の再送不要）。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: セッション一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSessionListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ws/ssh:
    get:
      summary: SSH WebSocket ターミナル
      description: |
        WebSocket にアップグレードされるエンドポイントです。

        **新規接続**: クエリに target_id を指定します。アップグレード後、最初のテキストメッセージでターゲット SSH 用の認証情報を JSON で送信してください。セッションの識別用に name（セッション名）と description（説明）を任意で含められます。
        ```json
        {"username":"...","password":"...","name":"セッション名（任意）","description":"説明（任意）"}
        ```
        **レジューム（再接続）**: クエリに session_id を指定します（GET /api/terminal/sessions で取得）。認証情報は不要で、切断前の出力がリングバッファから再送されます。

        ユーザーはターゲットへのアクセス権が必要です。ターゲットの protocol は ssh である必要があります（telnet の場合は 501）。
        認証情報が無効またはタイムアウト（15 秒）の場合は、サーバーが "error: ..." を送信し接続を閉じます。
        セッションはバックエンドで保持され、クライアント切断後もブリッジは継続します（バックグラウンド実行）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: query
          required: false
          schema:
            type: string
          description: 接続先ターゲットの ID（新規接続時必須。session_id と排他）
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: 既存セッションへの再接続（レジューム）。指定時は認証情報不要。
      responses:
        '101':
          description: WebSocket プロトコルへの切り替え
        '400':
          description: target_id 未指定、または WebSocket アップグレード失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定された target_id のターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: ターゲットのプロトコルが SSH 以外（現時点では SSH のみ対応）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

