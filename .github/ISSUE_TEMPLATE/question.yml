name: Question
description: Ask a question about Vantyx usage, configuration, or development.
title: "[question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended discussions please use
        [Discussions](https://github.com/nullpo7z/vantyx/discussions) instead.
        Use this template only when you need a concrete answer from maintainers.
  - type: textarea
    id: context
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
