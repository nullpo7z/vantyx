openapi: 3.1.0
info:
  title: Vantyx API
  version: 0.2.0
  description: |
    Vantyx バックエンドの公開 HTTP / WebSocket API 仕様。

    現時点でカバーしている機能:
    - ヘルスチェック (GET /healthz)
    - ローカルユーザー認証 (POST /api/login) と Cookie セッション
    - 自己情報取得 (GET /api/me)
    - アクセスグループの一覧・作成 (GET/POST /api/groups)
    - ターゲットの一覧・作成 (GET/POST /api/targets)
    - SSH WebSocket ターミナル (GET /ws/ssh)。認証後、ターゲットへの SSH をブリッジ。セッション永続化の土台（リングバッファ）あり。
    エラー応答はすべて application/json の ErrorResponse (message) で統一しています。
servers:
  # Swagger UI の Try it out を「アクセスしているオリジン」に合わせるため、相対 URL を優先します。
  # 例: https://<server-ip>/docs を開いた場合、/api/login は https://<server-ip>/api/login へ送信されます。
  - url: /
    description: "同一オリジン（推奨: https://<server-host>/）"
  - url: https://localhost:8443
    description: "ローカル開発用 HTTPS（go run: :8443）"
  - url: http://localhost:8080
    description: ローカル開発用 HTTP（常に HTTPS へ 301 リダイレクト）

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vantyx_session
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
        username:
          type: string
      required:
        - user_id
        - username
    Target:
      type: object
      description: 接続先ターゲット（サーバー）の情報。
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
          description: "階層管理用のフォルダパス（例: prod/network）。空の場合はルート。"
        host:
          type: string
          description: 接続先ホスト名または IP アドレス
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: ["ssh", "telnet"]
      required:
        - id
        - name
        - host
        - port
        - protocol
    AccessGroup:
      type: object
      description: アクセスグループ。ユーザーが所属し、ターゲットを紐づける単位。
      properties:
        id:
          type: string
          description: "階層を含むアクセスグループID（例: prod/network）"
        name:
          type: string
          description: 表示名
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
      required:
        - id
        - name
        - targets

paths:
  /healthz:
    get:
      summary: ヘルスチェック
      description: アプリケーションが稼働しているかを確認するためのシンプルなヘルスチェックエンドポイント。
      responses:
        '200':
          description: 正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/login:
    post:
      summary: ログイン
      description: ユーザー名とパスワードでログインし、`vantyx_session` Cookie を発行します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功
          headers:
            Set-Cookie:
              description: vantyx_session を含む Set-Cookie ヘッダ
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: リクエストボディ不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: セッション作成失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      summary: 自分自身のユーザー情報取得
      description: 現在のセッションに紐づくユーザー情報を返します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets:
    get:
      summary: アクセス可能なターゲット一覧
      description: ログイン中のユーザーがアクセス権を持つターゲット一覧を返します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ターゲット一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Target'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: ターゲット（サーバー）の追加
      description: 認証済みユーザーが新しいターゲットを追加し、指定したアクセスグループに紐づけます（ユーザーはそのグループに所属している必要があります）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 表示名
                group_id:
                  type: string
                  description: 紐づけ先のアクセスグループID
                path:
                  type: string
                  description: 任意のフォルダパス。省略時は group_id が利用されます（UI のグルーピング用途）。
                host:
                  type: string
                  description: ホスト名または IP
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 22
                protocol:
                  type: string
                  enum: ["ssh", "telnet"]
                  default: ssh
              required:
                - name
                - group_id
                - host
      responses:
        '201':
          description: 作成されたターゲット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: リクエスト不正（name/host 不足、protocol 不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定グループに所属していない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: group_id が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ターゲット作成またはグループ紐づけの内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/groups:
    get:
      summary: アクセスグループ一覧（所属 + ターゲット含む）
      description: ログイン中のユーザーが所属するアクセスグループ一覧を返します。各グループには紐づくターゲット一覧が含まれます。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: アクセスグループ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessGroup'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: アクセスグループの追加
      description: 新しいアクセスグループを作成し、作成者をそのグループに追加します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                path:
                  type: string
                  description: "階層プレフィックス（例: prod）。省略可。"
              required:
                - name
      responses:
        '201':
          description: 作成されたアクセスグループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
        '400':
          description: リクエスト不正（name 不足、invalid request body など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: グループ作成の内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ws/ssh:
    get:
      summary: SSH WebSocket ターミナル
      description: |
        WebSocket にアップグレードされるエンドポイントです。
        クエリパラメータ target_id で接続先ターゲットを指定します。ユーザーは当該ターゲットへのアクセス権が必要です。
        ターゲットの protocol は ssh である必要があります（telnet の場合は 501 を返します）。

        アップグレード後、**最初のテキストメッセージ**でターゲット SSH 用の認証情報を JSON で送信してください。
        ```json
        {"username":"...","password":"..."}
        ```
        認証情報が無効またはタイムアウト（15 秒）の場合は、サーバーがテキストメッセージ "error: ..." を送信し接続を閉じます。
        認証情報受理後、サーバーが空のテキストメッセージを 1 回送信し、続けてターゲットへ SSH 接続。以降のメッセージは SSH セッションと双方向にブリッジされます。
        セッションはバックエンドで保持され、出力はリングバッファに tee されます（レジューム用の API は今後の拡張）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: query
          required: true
          schema:
            type: string
          description: 接続先ターゲットの ID（GET /api/groups または GET /api/targets で取得可能）
      responses:
        '101':
          description: WebSocket プロトコルへの切り替え
        '400':
          description: target_id 未指定、または WebSocket アップグレード失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定された target_id のターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: ターゲットのプロトコルが SSH 以外（現時点では SSH のみ対応）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
