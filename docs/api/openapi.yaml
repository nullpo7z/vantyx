  /api/targets/{target_id}/files:
    get:
      summary: ファイル一覧（ディレクトリ）
      description: |
        ターゲット上のディレクトリ一覧を返します。SSH ターゲットは SFTP、TFTP ターゲットは TFTP。SFTP は保存済み認証必須。TFTP はディレクトリ一覧非対応のため空またはエラーになる場合があります。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: /
          description: リモートのディレクトリパス
      responses:
        '200':
          description: エントリ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileEntry'
        '400':
        '401':
        '403':
        '404':
        '502':
          description: ターゲット接続または list 失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: ファイル・ディレクトリの削除
      description: ターゲット上の指定パスを削除します。SFTP のみ対応（TFTP は未対応）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 削除するリモートパス
      responses:
        '204':
          description: 削除完了
        '400':
        '401':
        '403':
        '404':
        '501':
          description: TFTP は削除未対応
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ターゲット接続または削除失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets/{target_id}/files/download:
