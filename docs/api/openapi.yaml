openapi: 3.1.0
info:
  title: Vantyx API
  version: 0.6.0
  description: |
    Vantyx バックエンドの公開 HTTP / WebSocket API 仕様。

    現時点でカバーしている機能:
    - ヘルスチェック (GET /healthz)
    - ローカルユーザー認証 (POST /api/login) と Cookie セッション
    - 自己情報取得 (GET /api/me)。応答に user_id, username, role を含む。
    - パスワード変更 (POST /api/me/password)。認証済みユーザーが自分のパスワードを変更。
    - SSH 公開鍵（管理者のみ）: ユーザー管理でユーザーに紐づけて登録。GET/POST/DELETE /api/users/{user_id}/ssh-keys（一覧・追加・削除）。従来の /api/me/ssh-keys は自分用（管理者のみ）。Vantyx CLI（ssh user@vantyx）の公開鍵認証用。
    - アクセスグループの一覧・作成 (GET/POST /api/groups)。一覧は limit / after_id でキーセットページネーション対応。
    - グループメンバー管理（管理者のみ）: GET/POST /api/groups/{group_id}/members、DELETE /api/groups/{group_id}/members/{user_id}。
    - タグ（グループ・ターゲット・ユーザー）: GET/PUT /api/groups/{group_id}/tags、/api/targets/{target_id}/tags、/api/users/{user_id}/tags。同じタグを持つユーザーはそのタグが付いたターゲット（またはそのタグが付いたグループに属するターゲット）にアクセス可能。
    - ユーザー登録・一覧（管理者のみ）: GET /api/users、POST /api/users。
    - ターゲットの一覧・作成・更新・削除 (GET/POST/PUT/DELETE /api/targets, /api/targets/{target_id})。プロトコルは ssh / telnet / vnc / tftp。一覧は limit / after_id でキーセットページネーション対応。
    - ターミナル WebSocket (GET /ws/ssh)。認証後、ターゲットへの SSH または Telnet をブリッジ。セッション永続化・レジューム対応（GET /api/terminal/sessions で一覧、session_id で再接続）。
    - VNC WebSocket (GET /ws/vnc)。認証後、protocol=vnc のターゲットへ noVNC 用に RFB をブリッジ。クエリ target_id 必須。
    - ファイル転送: GET /api/targets/{target_id}/files（一覧・クエリ path）、GET /api/targets/{target_id}/files/download（ダウンロード・クエリ path）、POST /api/targets/{target_id}/files/upload（multipart: path, file）、DELETE /api/targets/{target_id}/files（削除・クエリ path）。SSH ターゲットは SFTP（保存済み認証必須）、TFTP ターゲットは TFTP（認証不要）。TFTP はディレクトリ一覧なし・削除未対応。
    - 録画: GET /api/recordings（メタデータ一覧。クエリ target_id でフィルタ可）。GET /api/recordings/{recording_id}/file でファイル取得。クエリ format=cast|gif|webm（省略時 cast）。cast=Asciinema 形式。gif/webm は agg（および WebM は ffmpeg）必要、未導入時 503。ブラウザターミナルおよび CLI（ssh）接続の両方が録画対象。
    - CLI SSH ゲートウェイ: VANTYX_SSH_LISTEN で有効化。ssh user@vantyx でログイン後、メニューからターゲット選択してプロキシ接続。VANTYX_RECORDINGS_DIR 設定時は CLI 接続も録画対象。
    - OpenAPI 仕様 (GET /api/spec) と Swagger UI (GET /docs) は admin のみアクセス可。
    エラー応答はすべて application/json の ErrorResponse (message) で統一しています。
servers:
  # Swagger UI の Try it out を「アクセスしているオリジン」に合わせるため、相対 URL を優先します。
  # 例: https://<server-ip>/docs を開いた場合、/api/login は https://<server-ip>/api/login へ送信されます。
  - url: /
    description: "同一オリジン（推奨: https://<server-host>/）"
  - url: https://localhost:8443
    description: "ローカル開発用 HTTPS（go run: :8443）"
  - url: http://localhost:8080
    description: ローカル開発用 HTTP（常に HTTPS へ 301 リダイレクト）

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vantyx_session
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    AuditEntry:
      type: object
      description: 監査ログ 1 件（サーバー内部イベント + HTTP API 操作ログ）。fields はイベントごとに異なる任意フィールド。
      properties:
        id:
          type: integer
          format: int64
          description: audit_logs 行 ID（ページングの after_id に使用）
        time:
          type: string
          format: date-time
        event:
          type: string
        fields:
          type: object
          additionalProperties: true
      required:
        - time
        - event
        - fields
    AuditLogsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: string
          description: 次ページ取得用カーソル（最終行の id）。省略時はこれ以上なし
      required:
        - items
    AuditForwarderConfig:
      type: object
      description: 監査ログの syslog/SIEM 転送設定（管理者のみ変更可能）。
      properties:
        enabled:
          type: boolean
          description: true のとき転送を有効化
        proto:
          type: string
          enum: [udp, tcp, unix, unixgram]
          description: syslog 転送プロトコル
        addr:
          type: string
          description: "宛先（udp/tcp: host:port、unix/unixgram: /dev/log 等）。unix/unixgram で空の場合は /dev/log を既定にする。"
        app:
          type: string
          description: syslog の app-name
        buffer:
          type: integer
          minimum: 0
          maximum: 200000
          description: 非同期送信バッファ（満杯時はドロップ）
      required:
        - enabled
        - proto
        - addr
        - app
        - buffer
    AuditForwarderSettingsResponse:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/AuditForwarderConfig'
        source:
          type: string
          enum: [db, env]
          description: "現在の設定ソース（db: 設定画面で保存済み、env: 環境変数のフォールバック）"
      required:
        - config
        - source
    AuditForwarderSettingsPutRequest:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/AuditForwarderConfig'
      required:
        - config
    CommandLogItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: command_logs 行 ID（ページングの after_id に使用）
        time:
          type: string
          format: date-time
        session_id:
          type: string
        user_id:
          type: string
        target_id:
          type: string
        line_text:
          type: string
      required:
        - time
        - session_id
        - user_id
        - target_id
        - line_text
    CommandLogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommandLogItem'
        next_cursor:
          type: string
          description: 次のページを取得する際に after_id に渡す値。存在しない場合は省略。
      required:
        - items
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      description: ログイン成功時および GET /api/me の応答。
      properties:
        user_id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: GET /api/me で返る。ログイン応答では省略される場合あり。
      required:
        - user_id
        - username
    SSHKeyItem:
      type: object
      description: Vantyx ログイン用に登録した SSH 公開鍵 1 件。管理者のみ登録・一覧・削除可能。
      properties:
        id:
          type: integer
          format: int64
        key_line:
          type: string
          description: authorized_keys 形式の 1 行（ssh-ed25519 / ssh-rsa 等）
        created_at:
          type: string
          format: date-time
      required:
        - id
        - key_line
        - created_at
    AddSSHKeyRequest:
      type: object
      properties:
        authorized_key:
          type: string
          description: authorized_keys 形式の 1 行
      required:
        - authorized_key
    RecordingItem:
      type: object
      description: 録画メタデータ 1 件（ファイルパスは含めない）。
      properties:
        id:
          type: string
        user_id:
          type: string
        target_id:
          type: string
        session_id:
          type: string
        channel_type:
          type: string
          description: "browser=ブラウザターミナル, cli=CLI（ssh）接続"
        started_at:
          type: string
        ended_at:
          type: string
        session_name:
          type: string
        session_description:
          type: string
    RecordingListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecordingItem'
      required:
        - items
    User:
      type: object
      description: ユーザー（一覧・作成応答）。パスワードは含めない。一覧では role, tags も返る。
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: 一覧で返る。作成応答では省略される場合あり。
        tags:
          type: array
          items:
            type: string
          description: 一覧で返る。ユーザーに付与されたタグ。
      required:
        - id
        - username
    TagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
      required:
        - tags
    Target:
      type: object
      description: 接続先ターゲット（サーバー）の情報。
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
          description: "階層管理用のフォルダパス（例: prod/network）。空の場合はルート。"
        host:
          type: string
          description: 接続先ホスト名または IP アドレス
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: ["ssh", "telnet", "vnc", "tftp"]
          description: "ssh=SSH ターミナル/SFTP, telnet=Telnet ターミナル, vnc=VNC リモートデスクトップ, tftp=TFTP ファイル転送"
        has_stored_credentials:
          type: boolean
          description: SSH ユーザー名・パスワードが保存されている場合 true（一覧で返す。値は含めない）
        has_ssh_key:
          type: boolean
          description: SSH 秘密鍵が保存されている場合 true（一覧で返す。値は含めない）
      required:
        - id
        - name
        - host
        - port
        - protocol
    FileEntry:
      type: object
      description: ディレクトリ一覧の 1 エントリ（GET /api/targets/{target_id}/files の要素）。
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        is_dir:
          type: boolean
        mod_time:
          type: string
          format: date-time
      required:
        - name
        - size
        - is_dir
    AccessGroup:
      type: object
      description: アクセスグループ。ユーザーが所属し、ターゲットを紐づける単位。
      properties:
        id:
          type: string
          description: "階層を含むアクセスグループID（例: prod/network）"
        name:
          type: string
          description: 表示名
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
      required:
        - id
        - name
        - targets
    GroupListResponse:
      type: object
      description: limit または after_id 指定時のグループ一覧応答（キーセットページネーション）。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessGroup'
        next_cursor:
          type: string
          description: 次のページを取得する際に after_id に渡す値。存在しない場合は省略。
    TargetListResponse:
      type: object
      description: limit または after_id 指定時のターゲット一覧応答（キーセットページネーション）。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Target'
        next_cursor:
          type: string
          description: 次のページを取得する際に after_id に渡す値。存在しない場合は省略。
    TerminalSessionItem:
      type: object
      description: アクティブなターミナルセッション 1 件（レジューム用）。
      properties:
        session_id:
          type: string
          description: セッション ID。GET /ws/ssh?session_id={id} で再接続（認証情報不要）。
        target_id:
          type: string
        target_name:
          type: string
        target_path:
          type: string
          description: "ターゲットの階層パス（例: prod/network）。未設定の場合は省略。"
        name:
          type: string
          description: セッション名（識別用・任意）。接続時の最初の JSON で name を送信可能。
        description:
          type: string
          description: 説明（任意）。接続時の最初の JSON で description を送信可能。
        created_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
          description: 最終活動時刻（クライアント操作およびリモート出力で更新）。
        idle:
          type: boolean
          description: 無活動警告閾値を超えている場合 true（自動終了はしない）。
        idle_seconds:
          type: integer
          description: 最終活動からの経過秒数（idle が true のとき）。
        protocol:
          type: string
          description: ターゲットのプロトコル（ssh / telnet 等）。
      required:
        - session_id
        - target_id
        - target_name
        - created_at
        - last_seen
    RDPSessionItem:
      type: object
      description: アクティブな RDP（ブラウザ noVNC）セッション 1 件。
      properties:
        session_id:
          type: string
        target_id:
          type: string
        target_name:
          type: string
        target_path:
          type: string
          description: "ターゲットの階層パス（例: prod/network）。未設定の場合は省略。"
        created_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
          description: 最終活動時刻（VNC 入出力・画面更新で更新。デタッチ後も監視継続）。
        idle:
          type: boolean
          description: 無活動警告閾値を超えている場合 true（自動終了はしない）。
        idle_seconds:
          type: integer
          description: 最終活動からの経過秒数（idle が true のとき）。
      required:
        - session_id
        - target_id
        - target_name
        - created_at
        - last_seen
    RDPSessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RDPSessionItem'
    TerminalSessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TerminalSessionItem'

paths:
  /healthz:
    get:
      summary: ヘルスチェック
      description: アプリケーションが稼働しているかを確認するためのシンプルなヘルスチェックエンドポイント。
      responses:
        '200':
          description: 正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/login:
    post:
      summary: ログイン
      description: ユーザー名とパスワードでログインし、`vantyx_session` Cookie を発行します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功
          headers:
            Set-Cookie:
              description: vantyx_session を含む Set-Cookie ヘッダ
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: リクエストボディ不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: セッション作成失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      summary: 自分自身のユーザー情報取得
      description: 現在のセッションに紐づくユーザー情報（user_id, username, role）を返します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/password:
    post:
      summary: パスワード変更
      description: 認証済みユーザーが自分のパスワードを変更します。現在のパスワードの一致確認と、新パスワードのポリシー検証を行います。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: 変更完了
        '400':
          description: リクエスト不正または新パスワードがポリシー未達
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証または現在のパスワードが誤り
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/ssh-keys:
    get:
      summary: SSH 公開鍵一覧（管理者のみ）
      description: 現在のユーザーに登録された Vantyx ログイン用 SSH 公開鍵一覧を返します。**管理者（admin）のみ**利用可能。CLI（ssh user@vantyx）の公開鍵認証に使用します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 公開鍵一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SSHKeyItem'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: SSH 公開鍵の追加（管理者のみ）
      description: 現在のユーザーに Vantyx ログイン用 SSH 公開鍵を 1 本追加します。**管理者（admin）のみ**利用可能。authorized_keys 形式の 1 行（ssh-ed25519 / ssh-rsa 等）を送信します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSSHKeyRequest'
      responses:
        '201':
          description: 追加された公開鍵（id, key_line, created_at）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHKeyItem'
        '400':
          description: リクエスト不正または無効な公開鍵
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/ssh-keys/{key_id}:
    delete:
      summary: SSH 公開鍵の削除（管理者のみ）
      description: 指定した ID の SSH 公開鍵を削除します。**管理者（admin）のみ**利用可能。自分の鍵のみ削除可能です。
      security:
        - cookieAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 削除完了
        '400':
          description: key_id が無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定した鍵が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets:
    get:
      summary: アクセス可能なターゲット一覧
      description: |
        ログイン中のユーザーがアクセス権を持つターゲット一覧を返します。
        **ページネーション**: クエリに limit または after_id を指定すると、レスポンスは `{ "items": [...], "next_cursor": "..." }` 形式になります。
        next_cursor が含まれる場合は、次リクエストで `after_id={next_cursor}` を付けて続きを取得します。limit 未指定時は 100、最大 1000。
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: 取得件数。指定時はキーセットページネーションになり、レスポンスは items/next_cursor 形式。
        - name: after_id
          in: query
          required: false
          schema:
            type: string
          description: この ID より大きいターゲットから取得（キーセット）。limit と組み合わせて使用。
      responses:
        '200':
          description: ターゲット一覧。limit/after_id 未指定時は配列、指定時は TargetListResponse。
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Target'
                  - $ref: '#/components/schemas/TargetListResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: ターゲット（サーバー）の追加
      description: 認証済みユーザーが新しいターゲットを追加し、指定したアクセスグループに紐づけます（ユーザーはそのグループに所属している必要があります）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 表示名
                group_id:
                  type: string
                  description: 紐づけ先のアクセスグループID
                path:
                  type: string
                  description: 任意のフォルダパス。省略時は group_id が利用されます（UI のグルーピング用途）。
                host:
                  type: string
                  description: ホスト名または IP
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 22
                protocol:
                  type: string
                  enum: ["ssh", "telnet", "vnc", "tftp"]
                  default: ssh
                ssh_username:
                  type: string
                  description: SSH ログイン用ユーザー名（任意）。保存すると接続時に利用可能。
                ssh_password:
                  type: string
                  description: SSH パスワード（任意）。保存時は AES-256-GCM で暗号化（OWASP ASVS L2）。鍵未設定時は 503 を返す。
              required:
                - name
                - group_id
                - host
      responses:
        '201':
          description: 作成されたターゲット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: リクエスト不正（name/host 不足、protocol 不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定グループに所属していない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: group_id が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SSH パスワードを保存するが暗号化鍵が未設定（VANTYX_SSH_PASSWORD_ENCRYPTION_KEY）。OWASP ASVS L2 準拠のため、パスワード保存時は鍵必須。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ターゲット作成またはグループ紐づけの内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets/{target_id}:
    put:
      summary: ターゲット（ホスト）の更新
      description: 認証済みユーザーが、アクセス権のあるターゲットの名前・ホスト・ポート・プロトコル・パス・SSH認証情報を更新します。target_id は変更されません。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
          description: 更新するターゲットの ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 22
                protocol:
                  type: string
                  enum: ["ssh", "telnet", "vnc", "tftp"]
                  default: ssh
                path:
                  type: string
                ssh_username:
                  type: string
                ssh_password:
                  type: string
                  description: 空文字で保存済みパスワードをクリア。非空のときは暗号化して保存（鍵必須）。
              required:
                - name
                - host
      responses:
        '200':
          description: 更新後のターゲット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当該ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SSH パスワード保存時は暗号化鍵必須
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 更新失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: ターゲット（ホスト）の削除
      description: 認証済みユーザーが、アクセス権のあるターゲットを削除します。グループとの紐づけも削除されます。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除完了
        '400':
          description: target_id 不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当該ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 削除失敗
          content:
