services:
  vantyx:
    image: nullpo7z/vantyx:latest
    ports:
      - "80:8080"
      - "443:8443"
      - "2222:2222"
      - "69:6969/udp"
    env_file:
      - .env
    environment:
      - VANTYX_EXTERNAL_HOST=${VANTYX_EXTERNAL_HOST}
      - VANTYX_TLS_SANS=${VANTYX_TLS_SANS:-${VANTYX_EXTERNAL_HOST}}
      - VANTYX_SSH_LISTEN=:2222
      - VANTYX_RECORDINGS_DIR=/app/recordings
      - VANTYX_SSH_PASSWORD_ENCRYPTION_KEY=${VANTYX_SSH_PASSWORD_ENCRYPTION_KEY}
    volumes:
      - /path/to/vantyx/certs:/app/certs # Make sure this directory exists
      - /path/to/vantyx/data:/app/data
      - /path/to/vantyx/recordings:/app/recordings
