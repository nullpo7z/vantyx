  /api/targets/probe-host-key:
    post:
      summary: SSH ホストキーの一回限りプローブ（admin）
      description: |
        指定された SSH エンドポイントに 1 回だけ接続し、サーバーが提示する
        ホストキーの SHA-256 フィンガープリントを返します。永続化はされず、
        Add Target / Edit Target の確認ダイアログ向けの補助 API です。

        ホストキー検証は `WithInsecureSkipHostKeyVerify` を 1 リクエスト
        だけ有効化して通過させ、コールバック内で `SHA256:<base64>` 形式の
        値だけをキャプチャします。失敗した場合は `proxy.dialFailed` 系の
        ローカライズドメッセージで 502 を返します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host:
                  type: string
                  description: 接続先ホスト名 / IP アドレス
                port:
                  type: integer
                  default: 22
                  description: 省略時は 22
      responses:
        '200':
          description: フィンガープリントを取得
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    type: string
                  port:
                    type: integer
                  fingerprint:
                    type: string
                    example: SHA256:abcdef0123456789...
        '400':
          description: ホストが空、もしくはリクエストボディが不正
        '401':
        '403':
          description: 非 admin
        '502':
          description: 接続失敗（タイムアウト / 拒否 / ルート不到達 など）

  /api/targets/{target_id}/ssh-host-key:
    put:
      summary: SSH ホストキーフィンガープリントの登録 / クリア（admin）
      description: |
        ターゲットの `ssh_host_key_fingerprint` を更新します。空文字を渡すと
        登録済みフィンガープリントを削除します（次回接続時に TOFU
        ダイアログが出ます）。

        フォーマット検証は `access.SetSSHHostKeyFingerprint` 内で行われ、
        `SHA256:<base64>` 以外（または不正な base64）は 400 を返します。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprint:
                  type: string
                  description: 空文字でクリア。それ以外は `SHA256:<base64>` 形式。
      responses:
        '200':
          description: 更新後のターゲット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: フォーマット不正（`SHA256:` ではない）
        '401':
          description: 未ログイン
        '403':
          description: 非 admin
        '404':
          description: ターゲットが存在しない

  /api/targets/{target_id}/files:
    get:
      summary: ファイル一覧（ディレクトリ）
      description: |
        ターゲット上のディレクトリ一覧を返します。SSH ターゲットは SFTP、TFTP ターゲットは TFTP。SFTP は保存済み認証必須。TFTP はディレクトリ一覧非対応のため空またはエラーになる場合があります。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: /
          description: リモートのディレクトリパス
      responses:
        '200':
          description: エントリ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileEntry'
        '400':
        '401':
        '403':
        '404':
        '502':
          description: ターゲット接続または list 失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: ファイル・ディレクトリの削除
      description: ターゲット上の指定パスを削除します。SFTP のみ対応（TFTP は未対応）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 削除するリモートパス
      responses:
        '204':
          description: 削除完了
        '400':
        '401':
        '403':
        '404':
        '501':
          description: TFTP は削除未対応
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ターゲット接続または削除失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets/{target_id}/files/download:
    get:
      summary: ファイルダウンロード
      description: ターゲット上のファイルをストリームで返します。SFTP または TFTP。Content-Disposition でファイル名を返します。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: ダウンロードするリモートファイルパス
      responses:
        '200':
          description: ファイル本体（application/octet-stream）
          headers:
            Content-Disposition:
              schema:
