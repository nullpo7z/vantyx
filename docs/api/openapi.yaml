openapi: 3.1.0
info:
  title: Vantyx API
  version: 0.7.0
  description: |
    Vantyx バックエンドの公開 HTTP / WebSocket API 仕様。

    現時点でカバーしている機能:
    - ヘルスチェック (GET /healthz)
    - ローカルユーザー認証 (POST /api/login) と Cookie セッション
    - 自己情報取得 (GET /api/me)。応答に user_id, username, role を含む。
    - パスワード変更 (POST /api/me/password)。認証済みユーザーが自分のパスワードを変更。
    - UI ロケール設定 (PUT /api/me/locale)。`'' | en | ja` から選択し、サーバー側に永続化（ログイン応答 / GET /api/me の `locale` で取得）。
    - エラーレスポンスの本文 (`message`) は呼び出し元のロケールで返ります。解決順は (1) 認証済みユーザーの保存済みロケール、(2) `Accept-Language` ヘッダー、(3) デフォルト英語、です。
    - SSH 公開鍵（管理者のみ）: ユーザー管理でユーザーに紐づけて登録。GET/POST/DELETE /api/users/{user_id}/ssh-keys（一覧・追加・削除）。従来の /api/me/ssh-keys は自分用（管理者のみ）。Vantyx CLI（ssh user@vantyx）の公開鍵認証用。**これは接続先用の秘密鍵ライブラリ `/api/ssh-keys` とは別物です。**
    - 資格情報ライブラリ（管理者のみ、Keys / Identities 分離）: **Keys** — GET/POST/PUT/DELETE /api/ssh-keys（SSH 秘密鍵 PEM のみ、一覧は key_type / has_passphrase のみ返却）。**Identities** — GET/POST/PUT/DELETE /api/credential-identities（ユーザー名 + パスワード / 鍵 / 両方、auth_method 付き）。詳細は docs/credentials.md。
    - アクセスグループの一覧・作成 (GET/POST /api/groups)。一覧は limit / after_id でキーセットページネーション対応。
    - グループメンバー管理（管理者のみ）: GET/POST /api/groups/{group_id}/members、DELETE /api/groups/{group_id}/members/{user_id}。
    - タグ（グループ・ターゲット・ユーザー）: GET/PUT /api/groups/{group_id}/tags、/api/targets/{target_id}/tags、/api/users/{user_id}/tags。同じタグを持つユーザーはそのタグが付いたターゲット（またはそのタグが付いたグループに属するターゲット）にアクセス可能。
    - ユーザー登録・一覧（管理者のみ）: GET /api/users、POST /api/users。
    - ターゲットの一覧・作成・更新・削除 (GET/POST/PUT/DELETE /api/targets, /api/targets/{target_id})。プロトコルは ssh / telnet / vnc / rdp / ftp / tftp。作成・更新時に credential_identity_id / ssh_key_id でライブラリから秘密情報をコピー可能。一覧は limit / after_id でキーセットページネーション対応。
    - ターミナル WebSocket (GET /ws/ssh)。認証後、ターゲットへの SSH または Telnet をブリッジ。セッション永続化・レジューム対応（GET /api/terminal/sessions で一覧、session_id で再接続）。mode=writer|viewer、招待トークン（invite=）で共同セッションに参加。
    - 共同ターミナルセッション（SSH/Telnet）: 招待の発行・参加・参加者一覧・キック・書き込み権リクエスト/付与/解放（/api/terminal/sessions/{id}/invitations ほか）。指名招待は GET /api/invitations/incoming。UI 同期は GET /api/events/sessions（SSE）。詳細は docs/collaborative-sessions.md。
    - SSH ホスト鍵 TOFU: POST /api/targets/probe-host-key、PUT /api/targets/{id}/ssh-host-key。接続時は WebSocket フレーム host_key_unknown / host_key_mismatch。
    - VNC WebSocket (GET /ws/vnc)。認証後、protocol=vnc のターゲットへ noVNC 用に RFB をブリッジ。クエリ target_id 必須。
    - ファイル転送: GET /api/targets/{target_id}/files（一覧・クエリ path）、GET /api/targets/{target_id}/files/download（ダウンロード・クエリ path）、POST /api/targets/{target_id}/files/upload（multipart: path, file）、DELETE /api/targets/{target_id}/files（削除・クエリ path）。SSH ターゲットは SFTP（保存済み認証必須）、リモート TFTP ターゲットは TFTP クライアント（認証不要・一覧・削除未対応）。
    - 組み込み TFTP サーバー（Vantyx 内蔵）: GET /api/tftp/targets/{target_id}/files/*。protocol=tftp のターゲット向け。ローカルディスク（VANTYX_TFTP_ROOT）上のファイルを操作。実際の TFTP プロトコル経由の書き込み（WRQ）は POST/DELETE /api/tftp/targets/{target_id}/write-window で開閉する時限ウィンドウが無いと拒否される（送信元 IP は偽装可能なため、IP 一致だけでは許可しない）。
    - バックグラウンドファイル転送: GET /api/file-transfers（自分のジョブ一覧）、GET /api/file-transfers/{transfer_id}（状態）、DELETE /api/file-transfers/{transfer_id}（キャンセル）、GET /api/file-transfers/{transfer_id}/content（完了したダウンロードの取得）、POST /api/file-transfers/download（JSON: backend, target_id, path → 202）、POST /api/file-transfers/upload（multipart: backend, target_id, path, file → 202）。backend は remote（SFTP/FTP/リモート TFTP）または tftp_server（組み込み TFTP）。ジョブは SQLite（file_transfer_jobs）に永続化。単一ファイル上限 64MB。アップロードは receiving（ブラウザ→Vantyx 受信）中に離脱すると失敗しうる。
    - 録画: GET /api/recordings（メタデータ一覧。クエリ target_id でフィルタ可）。GET /api/recordings/{recording_id}/file でファイル取得。クエリ format=cast|gif|mp4（省略時 cast）。cast=Asciinema 形式またはネイティブ MP4。gif/mp4 変換は 202 Accepted でバックグラウンドキュー（GET /api/recordings/exports で進捗確認）。RDP/VNC 画面録画は MP4（H.264）で保存。ブラウザターミナルおよび CLI（ssh）接続の両方が録画対象。
    - CLI SSH ゲートウェイ: VANTYX_SSH_LISTEN で有効化。ssh user@vantyx でログイン後、メニューからターゲット選択してプロキシ接続。VANTYX_RECORDINGS_DIR 設定時は CLI 接続も録画対象。
    - OpenAPI 仕様 (GET /api/spec) と Swagger UI (GET /docs) は admin のみアクセス可。
    エラー応答はすべて application/json の ErrorResponse (message) で統一しています。
servers:
  # Swagger UI の Try it out を「アクセスしているオリジン」に合わせるため、相対 URL を優先します。
  # 例: https://<server-ip>/docs を開いた場合、/api/login は https://<server-ip>/api/login へ送信されます。
  - url: /
    description: "同一オリジン（推奨: https://<server-host>/）"
  - url: https://localhost:8443
    description: "ローカル開発用 HTTPS（go run: :8443）"
  - url: http://localhost:8080
    description: ローカル開発用 HTTP（常に HTTPS へ 301 リダイレクト）

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vantyx_session
    bearerAuth:
      type: http
      scheme: bearer
      description: 自動化用 API トークン（`vtx_...`、Account settings → API tokens で作成）。cookieAuth を要求するすべての /api エンドポイントで代替可能（ログイン・パスワード・二要素認証・トークン管理を除く）。`read` スコープは GET/HEAD のみ。
  schemas:
    ErrorResponse:
      type: object
      description: |
        エラー応答の汎用形式。`message` の文言は呼び出し元のロケール
        (`users.locale` → `Accept-Language` → 既定 `en`) で localize されて返ります。
        現在サポートしているロケールは `en` / `ja` です。
        全ての API ハンドラ（auth, users, groups, targets, sessions, recordings,
        files / file-transfers, tftp, settings など）の主要なエラー文言は
        i18n カタログ経由で生成されます。time_range クエリ (from/to)、
        protocol バリデーション、file-transfers の state/direction/backend/
        after_cursor バリデーション、`/api/me/password` のポリシーチェック、
        `proxyerrors`（TCP 接続失敗の SFTP / Telnet / SSH ターミナル
        メッセージ）、および `internal/access` / `internal/auth` の
        identifier / tag バリデーション (`validation.*`, `tags.*` キー群)
        も localize されます。残余のシステム / DB エラーは
        `common.internalError` で localize された 500 として返ります。
      properties:
        message:
          type: string
          description: 人間可読のエラーメッセージ（ロケーライズ済み）。
      required:
        - message
    AuditEntry:
      type: object
      description: 監査ログ 1 件（サーバー内部イベント + HTTP API 操作ログ）。fields はイベントごとに異なる任意フィールド。
      properties:
        id:
          type: integer
          format: int64
          description: audit_logs 行 ID（ページングの after_id に使用）
        time:
          type: string
          format: date-time
        event:
          type: string
        fields:
          type: object
          additionalProperties: true
      required:
        - time
        - event
        - fields
    AuditLogsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: string
          description: 次ページ取得用カーソル（最終行の id）。省略時はこれ以上なし
      required:
        - items
    AuditForwarderConfig:
      type: object
      description: 監査ログの syslog/SIEM 転送設定（管理者のみ変更可能）。
      properties:
        enabled:
          type: boolean
          description: true のとき転送を有効化
        proto:
          type: string
          enum: [udp, tcp, unix, unixgram]
          description: syslog 転送プロトコル
        addr:
          type: string
          description: "宛先（udp/tcp: host:port、unix/unixgram: /dev/log 等）。unix/unixgram で空の場合は /dev/log を既定にする。"
        app:
          type: string
          description: syslog の app-name
        buffer:
          type: integer
          minimum: 0
          maximum: 200000
          description: 非同期送信バッファ（満杯時はドロップ）
      required:
        - enabled
        - proto
        - addr
        - app
        - buffer
    AuditForwarderSettingsResponse:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/AuditForwarderConfig'
        source:
          type: string
          enum: [db, env]
          description: "現在の設定ソース（db: 設定画面で保存済み、env: 環境変数のフォールバック）"
      required:
        - config
        - source
    AuditForwarderSettingsPutRequest:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/AuditForwarderConfig'
      required:
        - config
    CommandLogItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: command_logs 行 ID（ページングの after_id に使用）
        time:
          type: string
          format: date-time
        session_id:
          type: string
        user_id:
          type: string
        target_id:
          type: string
        line_text:
          type: string
      required:
        - time
        - session_id
        - user_id
        - target_id
        - line_text
    CommandLogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommandLogItem'
        next_cursor:
          type: string
          description: 次のページを取得する際に after_id に渡す値。存在しない場合は省略。
      required:
        - items
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      description: ログイン成功時および GET /api/me の応答。
      properties:
        user_id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: GET /api/me で返る。ログイン応答では省略される場合あり。
        locale:
          type: string
          enum: ['', en, ja]
          description: ユーザーが UI 設定として保存したロケール。空文字なら未設定で、クライアントは自身のデフォルト（英語）を使用する。
        require_password_change:
          type: boolean
          description: 初期 admin パスワード等で要強制変更の場合 true。
        totp_enabled:
          type: boolean
          description: GET /api/me で返る。二要素認証（TOTP）が有効なら true。
        timezone:
          type: string
          description: サーバー全体のタイムゾーン（`VANTYX_TIMEZONE`、IANA 名、既定 UTC）。ログ・監査ログ・UI・CLI はすべてこのゾーンで時刻を表示する。ユーザー側で変更はできない。
        tags:
          type: array
          items:
            type: string
          description: GET /api/me で返る。ユーザーに付与されたタグ。
        groups:
          type: array
          description: GET /api/me で返る。アクセスできるグループ（所属・タグ一致とその下位グループ）。
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
      required:
        - user_id
        - username
    AccessRequest:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        username:
          type: string
        group_id:
          type: string
        group_name:
          type: string
        reason:
          type: string
        duration_seconds:
          type: integer
        status:
          type: string
          enum: [pending, approved, denied, cancelled]
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        decided_by:
          type: string
        decision_note:
          type: string
        expires_at:
          type: string
          format: date-time
          description: 承認時に付与したメンバーシップの期限（無期限なら省略）
    APIToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: トークン先頭 12 文字（識別用）
        scope:
          type: string
          enum: [read, write]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        active:
          type: boolean
    MFARequiredResponse:
      type: object
      description: |
        POST /api/login でパスワードは正しいが二要素認証（TOTP）が有効なユーザーの応答。
        Cookie は発行されず、`mfa_token` を POST /api/login/totp に渡して完了する。
        `mfa_token` の有効期限は 5 分、誤コード 5 回で破棄される。
      properties:
        mfa_required:
          type: boolean
          enum: [true]
        mfa_token:
          type: string
      required: [mfa_required, mfa_token]
    TOTPStatus:
      type: object
      properties:
        enabled:
          type: boolean
        pending:
          type: boolean
          description: setup 済みだが confirm 前
        recovery_codes_left:
          type: integer
        confirmed_at:
          type: string
          format: date-time
      required: [enabled, pending, recovery_codes_left]
    SSHKeyItem:
      type: object
      description: Vantyx ログイン用に登録した SSH 公開鍵 1 件。管理者のみ登録・一覧・削除可能。
      properties:
        id:
          type: integer
          format: int64
        key_line:
          type: string
          description: authorized_keys 形式の 1 行（ssh-ed25519 / ssh-rsa 等）
        created_at:
          type: string
          format: date-time
      required:
        - id
        - key_line
        - created_at
    AddSSHKeyRequest:
      type: object
      properties:
        authorized_key:
          type: string
          description: authorized_keys 形式の 1 行
      required:
        - authorized_key
    RecordingItem:
      type: object
      description: 録画メタデータ 1 件（ファイルパスは含めない）。
      properties:
        id:
          type: string
        user_id:
          type: string
        target_id:
          type: string
        session_id:
          type: string
        channel_type:
          type: string
          description: "browser=ブラウザターミナル, cli=CLI（ssh）接続"
        started_at:
          type: string
        ended_at:
          type: string
        session_name:
          type: string
        session_description:
          type: string
        media_type:
          type: string
          description: "terminal=asciinema .cast, video=H.264 .mp4 (RDP/VNC)"
        storage_format:
          type: string
          description: "cast または mp4（ファイル拡張子に基づく）"
    RecordingExportJob:
      type: object
      description: 録画 GIF/MP4 バックグラウンド変換ジョブ（インメモリ）。
      properties:
        job_id:
          type: string
        recording_id:
          type: string
        format:
          type: string
          enum: [gif, mp4]
        state:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        error:
          type: string
        progress:
          type: integer
        progress_stage:
          type: string
        session_name:
          type: string
        session_description:
          type: string
        channel_type:
          type: string
        target_id:
          type: string
        target_name:
          type: string
        target_path:
          type: string
        recording_started_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        status_url:
          type: string
        file_url:
          type: string
    RecordingExportListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecordingExportJob'
      required:
        - items
    RecordingListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecordingItem'
      required:
        - items
    User:
      type: object
      description: ユーザー（一覧・作成応答）。パスワードは含めない。一覧では role, tags も返る。
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: 一覧で返る。作成応答では省略される場合あり。
        locale:
          type: string
          enum: ['', en, ja]
          description: 一覧で返る。ユーザーが UI 設定として保存したロケール。空文字なら未設定。
        tags:
          type: array
          items:
            type: string
          description: 一覧で返る。ユーザーに付与されたタグ。
        totp_enabled:
          type: boolean
          description: 一覧で返る。二要素認証（TOTP）が有効なら true。
      required:
        - id
        - username
    TagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
      required:
        - tags
    SSHKeySummary:
      type: object
      description: 管理者用 SSH 秘密鍵（Key）。一覧・作成応答。PEM 本文は含まない。
      properties:
        id:
          type: string
        label:
          type: string
        key_type:
          type: string
          description: PEM 解析結果（例 RSA, ED25519, ECDSA）。不明時は UNKNOWN または省略。
        has_passphrase:
          type: boolean
      required:
        - id
        - label
        - has_passphrase
    SSHKeyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SSHKeySummary'
      required:
        - items
    CredentialIdentitySummary:
      type: object
      description: 管理者用ログイン Identity。秘密値は含まない。
      properties:
        id:
          type: string
        label:
          type: string
        ssh_username:
          type: string
        has_password:
          type: boolean
        ssh_key_id:
          type: string
        ssh_key_label:
          type: string
        has_ssh_key:
          type: boolean
        has_passphrase:
          type: boolean
          description: 参照 Key にパスフレーズがある場合 true
        auth_method:
          type: string
          enum: [password, key, password_and_key]
      required:
        - id
        - label
    CredentialIdentityListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialIdentitySummary'
      required:
        - items
    Target:
      type: object
      description: 接続先ターゲット（サーバー）の情報。
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
          description: "階層管理用のフォルダパス（例: prod/network）。空の場合はルート。"
        host:
          type: string
          description: 接続先ホスト名または IP アドレス
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: ["ssh", "telnet", "vnc", "rdp", "ftp", "tftp"]
          description: "ssh=SSH ターミナル/SFTP, telnet=Telnet, vnc=VNC, rdp=RDP, ftp=FTP, tftp=TFTP"
        ssh_username:
          type: string
          description: 保存済み SSH ユーザー名（値は返す。パスワード・秘密鍵は含めない）
        has_stored_credentials:
          type: boolean
          description: SSH ユーザー名など資格情報が保存されている場合 true
        has_ssh_key:
          type: boolean
          description: SSH 秘密鍵が保存されている場合 true（値は含めない）
        needs_password:
          type: boolean
          description: ユーザー名のみ保存され接続時にパスワード入力が必要な場合 true
        needs_passphrase:
          type: boolean
          description: 暗号化された秘密鍵のみ保存され接続時にパスフレーズ入力が必要な場合 true
        sftp_enabled:
          type: boolean
        ftp_enabled:
          type: boolean
        tftp_enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        ssh_host_key_fingerprint:
          type: string
          description: |
            登録済み SSH ホストキーの SHA-256 フィンガープリント。
            形式は `SHA256:<base64>`（OpenSSH 標準、`ssh-keygen -lf` と一致）。
            未登録の場合はフィールドが省略されるか空文字で返ります。
            初回接続時は WebSocket フレーム `host_key_unknown` が返り、
            UI 側が `PUT /api/targets/{id}/ssh-host-key` で採用できます。
          example: "SHA256:nThbg6kXUpJWGl7E1IGOCspRomTxdCARLviKw6E5SY8"
      required:
        - id
        - name
        - host
        - port
        - protocol
    FileEntry:
      type: object
      description: ディレクトリ一覧の 1 エントリ（GET /api/targets/{target_id}/files の要素）。
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        is_dir:
          type: boolean
        mod_time:
          type: string
          format: date-time
      required:
        - name
        - size
        - is_dir
    AccessGroup:
      type: object
      description: アクセスグループ。ユーザーが所属し、ターゲットを紐づける単位。
      properties:
        id:
          type: string
          description: "階層を含むアクセスグループID（例: prod/network）"
        name:
          type: string
          description: 表示名
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
      required:
        - id
        - name
        - targets
    GroupListResponse:
      type: object
      description: limit または after_id 指定時のグループ一覧応答（キーセットページネーション）。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessGroup'
        next_cursor:
          type: string
          description: 次のページを取得する際に after_id に渡す値。存在しない場合は省略。
    TargetListResponse:
      type: object
      description: limit または after_id 指定時のターゲット一覧応答（キーセットページネーション）。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Target'
        next_cursor:
          type: string
          description: 次のページを取得する際に after_id に渡す値。存在しない場合は省略。
    TerminalSessionItem:
      type: object
      description: アクティブなターミナルセッション 1 件（レジューム用）。
      properties:
        session_id:
          type: string
          description: セッション ID。GET /ws/ssh?session_id={id} で再接続（認証情報不要）。
        target_id:
          type: string
        target_name:
          type: string
        target_path:
          type: string
          description: "ターゲットの階層パス（例: prod/network）。未設定の場合は省略。"
        name:
          type: string
          description: セッション名（識別用・任意）。接続時の最初の JSON で name を送信可能。
        description:
          type: string
          description: 説明（任意）。接続時の最初の JSON で description を送信可能。
        created_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
          description: 最終活動時刻（クライアント操作およびリモート出力で更新）。
        idle:
          type: boolean
          description: 無活動警告閾値を超えている場合 true（自動終了はしない）。
        idle_seconds:
          type: integer
          description: 最終活動からの経過秒数（idle が true のとき）。
        protocol:
          type: string
          description: ターゲットのプロトコル（ssh / telnet 等）。
      required:
        - session_id
        - target_id
        - target_name
        - created_at
        - last_seen
    RDPSessionItem:
      type: object
      description: アクティブな RDP（ブラウザ noVNC）セッション 1 件。
      properties:
        session_id:
          type: string
        target_id:
          type: string
        target_name:
          type: string
        target_path:
          type: string
          description: "ターゲットの階層パス（例: prod/network）。未設定の場合は省略。"
        created_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
          description: 最終活動時刻（VNC 入出力・画面更新で更新。デタッチ後も監視継続）。
        idle:
          type: boolean
          description: 無活動警告閾値を超えている場合 true（自動終了はしない）。
        idle_seconds:
          type: integer
          description: 最終活動からの経過秒数（idle が true のとき）。
      required:
        - session_id
        - target_id
        - target_name
        - created_at
        - last_seen
    RDPSessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RDPSessionItem'
    VNCSessionItem:
      type: object
      description: 直接 VNC 接続の共有セッション（GET /api/vnc/sessions）。
      properties:
        session_id:
          type: string
        target_id:
          type: string
        target_name:
          type: string
        target_path:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        idle:
          type: boolean
        idle_seconds:
          type: integer
      required:
        - session_id
        - target_id
        - target_name
        - created_at
        - last_seen
    VNCSessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VNCSessionItem'
    TerminalSessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TerminalSessionItem'
    FileTransferJob:
      type: object
      description: バックグラウンドファイル転送ジョブのスナップショット。
      properties:
        id:
          type: string
        target_id:
          type: string
        target_name:
          type: string
        backend:
          type: string
          description: remote（SFTP/FTP/リモート TFTP）または tftp_server（組み込み TFTP）
          enum: [remote, tftp_server]
        direction:
          type: string
          enum: [upload, download]
        remote_path:
          type: string
        file_name:
          type: string
        state:
          type: string
          description: receiving（アップロード受信中）, running, completed, failed, cancelled
          enum: [receiving, running, completed, failed, cancelled]
        progress:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - target_id
        - backend
        - direction
        - remote_path
        - file_name
        - state
        - progress
        - total
        - created_at
        - updated_at
    FileTransferListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileTransferJob'
    FileTransferDownloadRequest:
      type: object
      required:
        - backend
        - target_id
        - path
      properties:
        backend:
          type: string
          enum: [remote, tftp_server]
        target_id:
          type: string
        path:
          type: string
          description: リモート上の絶対パス（先頭 / 推奨）

paths:
  /healthz:
    get:
      summary: ヘルスチェック
      description: アプリケーションが稼働しているかを確認するためのシンプルなヘルスチェックエンドポイント。
      responses:
        '200':
          description: 正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/login:
    post:
      summary: ログイン
      description: |
        ユーザー名とパスワードでログインし、`vantyx_session` Cookie を発行します。
        二要素認証（TOTP）が有効なユーザーには Cookie を発行せず `MFARequiredResponse` を返すので、
        `POST /api/login/totp` で完了してください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功（または二要素認証が必要）
          headers:
            Set-Cookie:
              description: vantyx_session を含む Set-Cookie ヘッダ（MFA 要求時は無し）
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MFARequiredResponse'
        '400':
          description: リクエストボディ不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: セッション作成失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/login/totp:
    post:
      summary: 二要素認証コードでログインを完了
      description: |
        `POST /api/login` が `mfa_required` を返した後、認証アプリの 6 桁コードまたは未使用のリカバリーコードで
        ログインを完了し、`vantyx_session` Cookie を発行します。同一オリジンからの呼び出しのみ受け付けます。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  description: TOTP 6 桁、または `xxxxx-xxxxx` 形式のリカバリーコード
      responses:
        '200':
          description: 認証成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: mfa_token が無効・期限切れ、またはコード不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 試行回数超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/methods:
    get:
      summary: 利用可能なログイン方式（公開）
      description: ログイン画面が SSO ボタンを表示するかどうかを判断するために使います。
      security: []
      responses:
        '200':
          description: ログイン方式
          content:
            application/json:
              schema:
                type: object
                properties:
                  password:
                    type: boolean
                  oidc:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      display_name:
                        type: string

  /api/auth/oidc/login:
    get:
      summary: OIDC ログイン開始
      description: |
        OpenID Connect の Authorization Code（PKCE S256 + nonce）フローを開始し、IdP の認可エンドポイントへ 302 リダイレクトします。
        `VANTYX_OIDC_ISSUER` / `VANTYX_OIDC_CLIENT_ID` が未設定なら 404。
      security: []
      parameters:
        - in: query
          name: next
          schema:
            type: string
          description: ログイン後に戻る同一オリジンのパス（`/terminal?...` など）。外部 URL は無視。
      responses:
        '302':
          description: IdP へリダイレクト（`vantyx_oidc_state` Cookie を発行）
        '404':
          description: OIDC 未設定

  /api/auth/oidc/callback:
    get:
      summary: OIDC コールバック
      description: |
        IdP からの戻り。state Cookie・PKCE・ID トークン署名・nonce・aud を検証し、
        ローカルユーザーへ対応付けて `vantyx_session` Cookie を発行し `next` へ 302 します。
        失敗時は `/?oidc_error=<denied|state|provider_unavailable|exchange|token|not_provisioned|resolve|session>` へ 302 します。
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        '302':
          description: ログイン完了またはエラー付きでログイン画面へ

  /api/me:
    get:
      summary: 自分自身のユーザー情報取得
      description: |
        現在のセッションに紐づくユーザー情報（user_id, username, role, locale, timezone, totp_enabled）に加えて、
        `tags`（ユーザーのタグ）と `groups`（アクセスできるグループ。所属・タグ一致とその下位グループ）を返します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/password:
    post:
      summary: パスワード変更
      description: 認証済みユーザーが自分のパスワードを変更します。現在のパスワードの一致確認と、新パスワードのポリシー検証を行います。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: 変更完了
        '400':
          description: リクエスト不正または新パスワードがポリシー未達
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証または現在のパスワードが誤り
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/totp:
    get:
      summary: 自分の二要素認証（TOTP）状態
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPStatus'
        '401':
          description: 未認証
    delete:
      summary: 二要素認証を無効化
      description: 現在のパスワードで再認証したうえで TOTP 秘密鍵とリカバリーコードを削除します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '204':
          description: 無効化完了
        '403':
          description: パスワード不一致
        '404':
          description: TOTP が有効ではない

  /api/me/totp/setup:
    post:
      summary: 二要素認証の登録開始
      description: |
        新しい TOTP 秘密鍵を生成して未確認状態で保存し、認証アプリ用の otpauth URL・手入力用シークレット・QR コード（PNG data URL）を返します。
        `POST /api/me/totp/confirm` で確認するまでログインには要求されません。既に有効な場合は 409。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 登録情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauth_url:
                    type: string
                  secret:
                    type: string
                    description: Base32 シークレット
                  qr_png:
                    type: string
                    description: '`data:image/png;base64,...`'
        '409':
          description: 既に有効（先に無効化が必要）

  /api/me/totp/confirm:
    post:
      summary: 二要素認証の登録確認
      description: 認証アプリの最初のコードで登録を確定し、1 回限り表示されるリカバリーコード（8 個）を返します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: 有効化完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  recovery_codes:
                    type: array
                    items:
                      type: string
        '400':
          description: コード不一致、または setup 未実施
        '409':
          description: 既に有効

  /api/me/locale:
    put:
      summary: UI ロケール設定の更新
      description: |
        認証済みユーザーが自分の UI ロケール設定を更新します。
        サポートする値は空文字（未設定。クライアントは自身のデフォルトを使用）、`en`、`ja` です。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  enum: ['', en, ja]
      responses:
        '200':
          description: 保存されたロケール
          content:
            application/json:
              schema:
                type: object
                required: [locale]
                properties:
                  locale:
                    type: string
                    enum: ['', en, ja]
        '400':
          description: 未サポートのロケール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/tokens:
    get:
      summary: 自分の API トークン一覧
      description: 平文トークンは返しません（作成時の 1 回のみ）。ブラウザセッションでのみ利用可能（API トークンでは 403）。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: トークン一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIToken'
    post:
      summary: API トークンを作成
      description: |
        自動化用のベアラートークンを作成します。応答の `token`（`vtx_...`）はこの 1 回だけ返され、サーバーには SHA-256 のみ保存されます。
        `scope` は `read`（GET/HEAD のみ）または `write`。`expires_in_days` は 0（無期限）〜3650。監査イベント `api_token_created`。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [read, write]
                expires_in_days:
                  type: integer
      responses:
        '201':
          description: 作成したトークン（`token` を含む）
        '400':
          description: 不正な入力
        '409':
          description: 有効トークン数の上限（50）

  /api/me/tokens/{id}:
    delete:
      summary: 自分の API トークンを失効
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 失効完了
        '404':
          description: 存在しない、または既に失効

  /api/users/{user_id}/tokens:
    get:
      summary: ユーザーの API トークン一覧（管理者のみ）
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: トークン一覧

  /api/users/{user_id}/tokens/{id}:
    delete:
      summary: ユーザーの API トークンを失効（管理者のみ）
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 失効完了
        '404':
          description: 存在しない

  /api/me/ssh-keys:
    get:
      summary: SSH 公開鍵一覧（管理者のみ）
      description: 現在のユーザーに登録された Vantyx ログイン用 SSH 公開鍵一覧を返します。**管理者（admin）のみ**利用可能。CLI（ssh user@vantyx）の公開鍵認証に使用します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 公開鍵一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SSHKeyItem'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: SSH 公開鍵の追加（管理者のみ）
      description: 現在のユーザーに Vantyx ログイン用 SSH 公開鍵を 1 本追加します。**管理者（admin）のみ**利用可能。authorized_keys 形式の 1 行（ssh-ed25519 / ssh-rsa 等）を送信します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSSHKeyRequest'
      responses:
        '201':
          description: 追加された公開鍵（id, key_line, created_at）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHKeyItem'
        '400':
          description: リクエスト不正または無効な公開鍵
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
