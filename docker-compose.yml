services:
  vantyx:
    build: .
    # Hardening defaults (L-7 / CWE-250):
    #   - no-new-privileges:true forbids setuid-style privilege gain
    #     from anything the container launches.
    #   - cap_drop ALL plus a minimal cap_add (NET_BIND_SERVICE for
    #     :80 / :443 / :69 publishing) avoids ambient privileges.
    #   - read_only roots the container at a read-only filesystem;
    #     state lives in the named volumes / bind mounts below.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # 既定では 0.0.0.0 にバインドされ、全インターフェースで公開される。
      # 公開範囲を制限する場合は明示的に IP を指定する。
      # 例: 内部 LAN のみ公開する場合は VANTYX_BIND_HOST=10.0.0.5 を設定し、
      # 各ポート定義を "${VANTYX_BIND_HOST}:80:8080" の形に変更する (M-22 / CWE-668)。
      - "80:8080"    # HTTP → HTTPS リダイレクト（無効化不可）
      - "443:8443"   # HTTPS (TLS)
      - "2222:2222"  # CLI SSH ゲートウェイ (Phase 2)
      # TFTP: コンテナは nonroot のため 69 不可。ホスト 69 → コンテナ 6969。スイッチは 10.10.20.105 のまま（ホスト 69）
      - "69:6969/udp"
    environment:
      # リダイレクト先のホスト（どちらか必須）。本番では FQDN を指定
      - VANTYX_EXTERNAL_HOST=10.10.110.105
      # サーバーIP/ホスト名でアクセスする場合は SAN を追加（証明書再生成が必要）
      # 例: VANTYX_TLS_SANS=192.168.1.10,vantyx.example.com
      - VANTYX_TLS_SANS=10.10.110.105
      # CLI アクセス: ssh -p 2222 admin@<host>
      - VANTYX_SSH_LISTEN=:2222
      # DB をボリュームに保存（未設定時は data/vantyx.db）
      - VANTYX_SQLITE_PATH=/app/data/vantyx.db
      # ターミナル録画（Asciinema）を有効にする場合に指定。未設定時は録画しない。
      - VANTYX_RECORDINGS_DIR=/app/recordings
      # SSH パスワード暗号化キー（AES-256-GCM 用 / 32 バイトを Base64 にした値）。
      # `${VAR:?...}` 構文で起動時に必須化しているため、未設定の場合は
      # docker compose up が即座に失敗する（fail-fast）。リポジトリに固定値
      # を入れない（CWE-321 / 798）。`openssl rand -base64 32` で生成し、
      # 本番では Vault / sops / Secrets Manager から注入することを推奨。
      - VANTYX_SSH_PASSWORD_ENCRYPTION_KEY=${VANTYX_SSH_PASSWORD_ENCRYPTION_KEY:?VANTYX_SSH_PASSWORD_ENCRYPTION_KEY must be set (openssl rand -base64 32). Refusing to start in plaintext mode.}
      # 初回起動時にランダムな admin パスワードを stdout に出力する。
      # 既知の値を指定したい場合のみ VANTYX_INITIAL_ADMIN_PASSWORD を設定する。
      # - VANTYX_INITIAL_ADMIN_PASSWORD=
      # 信頼できるリバースプロキシ（TLS終端）CIDR。X-Forwarded-Proto / -For を
      # 受け入れる対象を明示的に列挙する。例: "10.0.0.0/8,fd00::/8"
      # - VANTYX_TRUSTED_PROXIES=
      # TFTP: コンテナは nonroot のため 69 不可。6969 で listen し、上記 69:6969/udp でホスト 69 に届く。
      - VANTYX_TFTP_LISTEN=0.0.0.0:6969
      # 監査ログ（永続化 + 外部転送）
      # - VANTYX_AUDIT_LOG_FILE=/app/data/audit.log
      # SIEM(Syslog)へ転送する場合:
      # - VANTYX_AUDIT_FORWARD_ADDR=siem.example.com:514
      # - VANTYX_AUDIT_FORWARD_PROTO=udp   # udp|tcp|unix|unixgram
      # - VANTYX_AUDIT_FORWARD_APP=vantyx
      # - VANTYX_AUDIT_FORWARD_BUFFER=2000
      # ローカル syslog(/dev/log) に流す場合:
      # - VANTYX_AUDIT_FORWARD_PROTO=unixgram
      # - VANTYX_AUDIT_FORWARD_ADDR=/dev/log
    env_file:
      - .env
    volumes:
      - /path/to/vantyx/certs:/app/certs
      - /path/to/vantyx/data:/app/data
      - /path/to/vantyx/recordings:/app/recordings
    # ホストの実パスにデータを置く場合: docker-compose.hostpath.example.yml を参照し
    # docker-compose.override.yml で volumes を差し替え（例: /path/to/vantyx/data:/app/data）

volumes:
  vantyx_certs:
  vantyx_data:
  vantyx_recordings:
