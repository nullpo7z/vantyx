  /api/tftp/targets/{target_id}/write-window:
    get:
      summary: 組み込み TFTP サーバー — 書き込みウィンドウの状態を取得
      description: |
        対象ターゲットの書き込みウィンドウが現在開いているかを返します。組み込み TFTP
        サーバーが起動していない場合も含め、常に 200 で open:false/true を返します
        （状態照会が「起動していないので不明」を返すことはありません）。単発の状態確認用。
        フロントエンドは通常、下記の SSE エンドポイント（GET .../write-window/events）を
        購読して初期状態とその後の変化を受け取ります。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 現在の状態
          content:
            application/json:
              schema:
                type: object
                properties:
                  open:
                    type: boolean
                  target_id:
                    type: string
                  client_ip:
                    type: string
                    description: open=true の場合のみ含まれる。
                  expires_at:
                    type: string
                    format: date-time
                    description: open=true の場合のみ含まれる。
        '400':
        '401':
        '403':
    post:
      summary: 組み込み TFTP サーバー — 書き込みウィンドウを開く
      description: |
        組み込み TFTP サーバーは UDP の送信元 IP が容易に偽装できるため（CWE-290）、
        実際の TFTP プロトコル経由の書き込み（WRQ）はデフォルトで全て拒否されます。
        このエンドポイントは、対象ターゲットに設定された Host（送信元 IP として一致が
        必須。他の IP からの WRQ はこのウィンドウの有無にかかわらず常に拒否される）
        からの書き込みのみを一定時間（デフォルト 5 分、最大 30 分）許可する時限ウィンドウを
        開きます。許可対象の IP はターゲット設定から自動的に決まり、リクエストボディでは
        指定できません。同一ターゲットへの既存ウィンドウは置き換えられます。読み取り（RRQ）
        はこのウィンドウの対象外です（`VANTYX_TFTP_ALLOW_READ_WITHOUT_WINDOW` を参照）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  description: ウィンドウの有効時間（秒）。省略時は 300 秒、最大 1800 秒。
      responses:
        '200':
          description: ウィンドウを開いた
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_id:
                    type: string
                  client_ip:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400':
        '401':
        '403':
        '503':
          description: 組み込み TFTP サーバーが起動していない（有効な TFTP ターゲットが存在しない）
    delete:
      summary: 組み込み TFTP サーバー — 書き込みウィンドウを閉じる
      description: 対象ターゲットの開いている書き込みウィンドウを即座に無効化します。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: ウィンドウを閉じた（元々開いていなくても成功）
        '401':
        '403':
        '503':
          description: 組み込み TFTP サーバーが起動していない（有効な TFTP ターゲットが存在しない）

  /api/tftp/targets/{target_id}/write-window/events:
    get:
      summary: 組み込み TFTP サーバー — 書き込みウィンドウの状態変化を購読（SSE）
      description: |
        接続直後に現在の状態を1件送信し、以降は open/close（同一ターゲットへの
        再オープンによる TTL リセットを含む）が起きるたびに、その操作を行った
        タブ/オペレーターに関わらず配信します。複数のタブや複数の操作者が同じ
        ターゲットの TFTP コンソールページを開いている場合、全員に即座に反映されます
        （ポーリング不要）。`Content-Type: text/event-stream`。25 秒ごとにコメント行
        (`: keep-alive`) を送信して、アイドル時にリバースプロキシのタイムアウトで
        切断されるのを防ぎます。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            `text/event-stream`。各メッセージの `data:` は GET .../write-window と
            同じ JSON 形式（open/target_id/client_ip?/expires_at?）。
        '400':
        '401':
        '403':
        '503':
          description: SSE ブローカーが利用できない（通常発生しない）

  /api/groups:
    get:
      summary: アクセスグループ一覧（所属 + ターゲット含む）
      description: |
        ログイン中のユーザーが所属するアクセスグループ一覧を返します。各グループには紐づくターゲット一覧が含まれます。
        **ページネーション**: クエリに limit または after_id を指定すると、レスポンスは `{ "items": [...], "next_cursor": "..." }` 形式になります。
        next_cursor が含まれる場合は、次リクエストで `after_id={next_cursor}` を付けて続きを取得します。limit 未指定時は 100、最大 1000。
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: 取得件数。指定時はキーセットページネーションになり、レスポンスは items/next_cursor 形式。
        - name: after_id
          in: query
          required: false
          schema:
            type: string
          description: この ID より大きいグループから取得（キーセット）。limit と組み合わせて使用。
      responses:
        '200':
          description: アクセスグループ一覧。limit/after_id 未指定時は配列、指定時は GroupListResponse。
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
