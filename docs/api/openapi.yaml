                $ref: '#/components/schemas/ErrorResponse'

  /api/recordings:
    get:
      summary: 録画メタデータ一覧
      description: |
        ログイン中のユーザーに属する録画のメタデータ一覧を返します。ファイルパスは含まれません。
        クエリ target_id を指定すると、そのターゲット（サーバー）に紐づく録画のみに絞り込みます。
        `from`/`to` で started_at を期間絞り込み（未指定時は直近 30 日、最大 90 日）。
        `channel_type`（browser / cli 等）、`session_id`（完全一致）でさらに絞り込み可能。
        管理者は `user_id` を指定して他ユーザーの録画を参照できます（非管理者が指定した場合は 403）。
        ブラウザターミナルおよび CLI（ssh）接続の両方が録画対象です（VANTYX_RECORDINGS_DIR 設定時）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: query
          required: false
          schema:
            type: string
          description: このターゲットに紐づく録画のみ返す（省略時は全件、最大 200 件）
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: started_at の期間開始
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: started_at の期間終了（排他的）
        - name: channel_type
          in: query
          required: false
          schema:
            type: string
          description: チャネル種別（browser / cli 等）
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: セッション ID（完全一致）
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: 録画所有者（管理者のみ。未指定時は自分の録画のみ）
      responses:
        '200':
          description: 録画一覧（items 配列）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 非管理者が user_id を指定した場合など
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 期間パラメータ不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/recordings/{recording_id}/file:
    get:
      summary: 録画ファイルの取得
      description: |
        指定した録画のファイルを返します。クエリ format で形式を指定します。
        - **cast**（省略時）: Asciinema v2 形式（.cast）。asciinema-player で再生可能。
        - **gif**: GIF アニメーション。ターミナル .cast および画面録画（MP4）からバックグラウンド変換（202 Accepted）。agg（cast 由来）または ffmpeg（MP4 由来）が必要。
        - **mp4**: MP4 動画。画面録画は録画時 H.264 で保存済みのため直接返却（200）。ターミナル .cast からはバックグラウンド変換（202 Accepted）。
      security:
        - cookieAuth: []
      parameters:
        - name: recording_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [cast, gif, mp4]
            default: cast
      responses:
        '200':
          description: 録画ファイル（Content-Type は形式に応じて application/json / image/gif / video/mp4 等）
          headers:
            Content-Disposition:
              description: ダウンロード時のファイル名
              schema:
                type: string
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 録画が存在しない、または自分の録画でない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '202':
          description: gif/mp4 変換をキューに追加（バックグラウンド処理）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingExportJob'
        '503':
          description: 録画未設定（VANTYX_RECORDINGS_DIR）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/recordings/{recording_id}/export:
    post:
      summary: 録画 GIF/MP4 変換をキューに追加
      description: |
        ターミナル .cast からの MP4/GIF、または画面録画 MP4 からの GIF をバックグラウンド変換キューに追加します。
        同一ユーザー・録画・形式で進行中のジョブがある場合は既存ジョブを返します（202）。
      security:
        - cookieAuth: []
      parameters:
        - name: recording_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [gif, mp4]
      responses:
        '202':
          description: 変換ジョブを受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingExportJob'
        '400':
          description: 形式不正、または直接ダウンロードのみの形式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 録画が存在しない、またはアクセス不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 録画未設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/recordings/exports:
    get:
      summary: 録画書き出しジョブ一覧
      description: ログインユーザーの GIF/MP4 変換ジョブ一覧。管理者は全ユーザーのジョブを返します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ジョブ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingExportListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/recordings/exports/{export_id}:
    get:
      summary: 録画書き出しジョブ状態
      security:
        - cookieAuth: []
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ジョブ状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingExportJob'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ジョブが存在しない、またはアクセス不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: 録画書き出しジョブのキャンセルまたは削除
      description: 進行中ジョブはキャンセル（204、state=cancelled）。完了済みはジョブと出力ファイルを削除。
      security:
        - cookieAuth: []
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: キャンセルまたは削除完了
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ジョブが存在しない、またはアクセス不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/recordings/exports/{export_id}/file:
    get:
      summary: 完了した書き出しファイルの取得
      security:
        - cookieAuth: []
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 変換済み GIF または MP4
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ジョブまたはファイルが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 変換未完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/terminal/sessions:
    get:
      summary: アクティブなターミナルセッション一覧
      description: |
        ログイン中のユーザーに属するアクティブなターミナルセッション一覧を返します。
        レジューム時は、返却された session_id を GET /ws/ssh?session_id={id} に渡して再接続します（認証情報の再送不要）。
      security:
