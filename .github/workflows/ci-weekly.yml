name: CI weekly

# Slow / informational jobs that do not need to gate every PR for a
# single-maintainer project. Runs on a weekly schedule and on demand via
# the GitHub UI ("Run workflow"). The schedule only ever runs on the
# default branch, so every job checks out BOTH main and dev explicitly:
# main is what is released, dev is where the work happens.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-weekly-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, dev]
    name: link-check (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Only fail on broken links inside the repository's Markdown
          # tree; external links are reported but not fatal so a flaky
          # third-party site cannot block the weekly run.
          args: >-
            --no-progress
            --offline
            --include-fragments
            './**/*.md'
          fail: true

  security-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, dev]
    name: security-scan (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          # Advisories without an upstream fix cannot be acted on and
          # would otherwise fail every week until one appears.
          ignore-unfixed: "true"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          cache: true
      - name: Install gosec
        # Pinned: @latest silently picks up new rules and breaks the run
        # without any change in the repository.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Run gosec
        run: gosec -exclude=G703,G304,G706,G104 ./...

  build-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, dev]
    name: build-docker (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - name: Build Docker image
        run: docker build -t vantyx:ci .
