name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main", "dev"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Run gofmt."
            exit 1
          fi
      - name: Install golangci-lint
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          GOBIN="$(go env GOPATH)/bin"
          mkdir -p "$GOBIN"
          export PATH="$GOBIN:$PATH"
          if ! command -v golangci-lint >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2; then
                break
              fi
              echo "golangci-lint install attempt ${attempt} failed, retrying..."
              sleep 15
            done
          fi
          golangci-lint version
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Run golangci-lint
        run: golangci-lint run --config=./configs/golangci.yml --issues-exit-code=1

  lint-fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        if: hashFiles('web/package-lock.json') != ''
        run: |
          cd web
          npm ci
      - name: Lint frontend
        if: hashFiles('web/package.json') != ''
        run: |
          cd web
          npm run lint -- --max-warnings=0
      - name: Prettier check
        if: hashFiles('web/.prettierrc*') != ''
        run: |
          cd web
          npx --yes prettier --check 'src/**/*.{js,ts,jsx,tsx,css,html}'
      - name: Typecheck frontend
        if: hashFiles('web/tsconfig.json') != ''
        run: |
          cd web
          npx tsc --noEmit

  test-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core
            pkgs: >-
              ./cmd/... ./docs/...
              ./internal/db/... ./internal/i18n/... ./internal/logging/...
              ./internal/mock/... ./internal/netutil/... ./internal/protocols/...
              ./internal/proxyerrors/... ./internal/rdpvnc/... ./internal/recording/...
              ./internal/secret/... ./internal/session/... ./internal/sftp/...
              ./internal/sharing/... ./internal/telnetproxy/... ./internal/tftp/...
              ./internal/vncproxy/...
          - id: access-auth-filetransfer
            pkgs: ./internal/access/... ./internal/auth/... ./internal/filetransfer/...
          - id: ssh
            pkgs: ./internal/sshd/... ./internal/sshproxy/...
          - id: httpapi
            pkgs: ./internal/httpapi/...
    name: test-go (${{ matrix.id }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Run tests
        run: go test ${{ matrix.pkgs }} -timeout 10m
      - name: Compute coverage (informational)
        if: matrix.id == 'httpapi'
        run: |
          go test ./internal/access ./internal/auth ./internal/httpapi ./internal/netutil ./internal/session ./internal/sshproxy -covermode=atomic -coverprofile=coverage.out
          echo "Coverage summary (informational, not a CI gate):"
          go tool cover -func=coverage.out | tail -1
