run:
  timeout: 5m
  issues-exit-code: 1

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - web/node_modules

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - gosec
    - gocyclo

linters-settings:
  gocyclo:
    min-complexity: 50

