openapi: 3.1.0
info:
  title: Vantyx API
  version: 0.1.0
  description: |
    Vantyx バックエンドの公開 HTTP / WebSocket API 仕様。

    現時点では以下の機能をカバーしています。

    - ヘルスチェック
    - ローカルユーザー認証
    - セッションベースの自己情報取得
    - アクセス可能なターゲット一覧の取得
    - SSH WebSocket ターミナル（ターゲットへの SSH ブリッジ）
servers:
  - url: http://localhost:8080
    description: ローカル開発用サーバー

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vantyx_session
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
        username:
          type: string
      required:
        - user_id
        - username
    Target:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
          description: |
            階層管理用のフォルダパス（例: "prod/network"）。空文字はルートを表します。
        host:
          type: string
          description: 接続先ホスト名または IP アドレス
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: ["ssh", "telnet"]
    AccessGroup:
      type: object
      properties:
        id:
          type: string
          description: 階層を含むアクセスグループID（例: "prod/network"）
        name:
          type: string
          description: 表示名
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
      required:
        - id
        - name
        - targets
      required:
        - id
        - name
        - host
        - port
        - protocol

paths:
  /healthz:
    get:
      summary: ヘルスチェック
      description: アプリケーションが稼働しているかを確認するためのシンプルなヘルスチェックエンドポイント。
      responses:
        '200':
          description: 正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/login:
    post:
      summary: ログイン
      description: ユーザー名とパスワードでログインし、`vantyx_session` Cookie を発行します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功
          headers:
            Set-Cookie:
              description: vantyx_session を含む Set-Cookie ヘッダ
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: リクエストボディ不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      summary: 自分自身のユーザー情報取得
      description: 現在のセッションに紐づくユーザー情報を返します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets:
    get:
      summary: アクセス可能なターゲット一覧
      description: ログイン中のユーザーがアクセス権を持つターゲット一覧を返します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ターゲット一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Target'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: ターゲット（サーバー）の追加
      description: 認証済みユーザーが新しいターゲットを追加し、指定したアクセスグループに紐づけます（ユーザーはそのグループに所属している必要があります）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 表示名
                group_id:
                  type: string
                  description: 紐づけ先のアクセスグループID
                path:
                  type: string
                  description: 任意のフォルダパス。省略時は group_id が利用されます（UI のグルーピング用途）。
                host:
                  type: string
                  description: ホスト名または IP
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 22
                protocol:
                  type: string
                  enum: ["ssh", "telnet"]
                  default: ssh
              required:
                - name
                - group_id
                - host
      responses:
        '201':
          description: 作成されたターゲット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: リクエスト不正（name/host 不足、protocol 不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定グループに所属していない
        '404':
          description: group_id が存在しない

  /api/groups:
    get:
      summary: アクセスグループ一覧（所属 + ターゲット含む）
      description: ログイン中のユーザーが所属するアクセスグループ一覧を返します。各グループには紐づくターゲット一覧が含まれます。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: アクセスグループ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessGroup'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: アクセスグループの追加
      description: 新しいアクセスグループを作成し、作成者をそのグループに追加します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                path:
                  type: string
                  description: 階層プレフィックス（例: "prod"）。省略可。
              required:
                - name
      responses:
        '201':
          description: 作成されたアクセスグループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
        '400':
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ws/ssh:
    get:
      summary: SSH WebSocket ターミナル
      description: |
        WebSocket にアップグレードされるエンドポイントです。
        クエリパラメータ target_id で接続先ターゲットを指定します。ユーザーは当該ターゲットへのアクセス権が必要です。
        ターゲットの protocol は ssh である必要があります（telnet の場合は 501 を返します）。

        アップグレード後、**最初のテキストメッセージ**でターゲット SSH 用の認証情報を JSON で送信してください。
        ```json
        {"username":"...","password":"..."}
        ```
        認証情報が無効またはタイムアウト（15 秒）の場合は、サーバーがエラーテキストメッセージを送信し接続を閉じます。
        認証情報受理後、サーバーがターゲットへ SSH 接続し、以降のバイナリメッセージは SSH セッションと双方向にブリッジされます。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: query
          required: true
          schema:
            type: string
          description: 接続先ターゲットの ID（GET /api/targets で取得可能）
      responses:
        '101':
          description: WebSocket プロトコルへの切り替え
        '400':
          description: target_id 未指定、または WebSocket アップグレード失敗
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定ターゲットへのアクセス権なし
        '404':
          description: 指定された target_id のターゲットが存在しない
        '501':
          description: ターゲットのプロトコルが SSH 以外（現時点では SSH のみ対応）
