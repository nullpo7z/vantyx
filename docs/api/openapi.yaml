  /api/audit:
    get:
      summary: 監査ログ取得（管理者のみ）
      description: |
        監査ログを新しい順に返します。`limit`/`event`/`user_id`/`from`/`to` でフィルタできます。
        実装は DB 永続ログ（audit_logs）を優先し、DB が使えない場合はメモリ上の直近分にフォールバックします。
        `from`/`to` 未指定時は直近 30 日。最大範囲は 90 日（超過は 400）。
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: event
          in: query
          required: false
          schema:
            type: string
          description: event の部分一致（LIKE）
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: user_id の完全一致
        - name: exclude_event
          in: query
          required: false
          schema:
            type: string
          description: 除外する event（カンマ区切り可。例: http_request）
        - name: after_id
          in: query
          required: false
          schema:
            type: string
          description: 前ページ最終行の audit_logs.id（より古い行を取得）
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: 期間開始（RFC3339 または YYYY-MM-DD、UTC 日境界）
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: 期間終了（排他的。RFC3339 または YYYY-MM-DD）
      responses:
        '200':
          description: 監査ログ一覧（next_cursor があれば続きあり）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 期間パラメータ不正（from > to、範囲超過など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/settings/audit-forwarder:
    get:
