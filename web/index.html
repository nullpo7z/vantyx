<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantyx</title>
    <meta name="description" content="Vantyx — secure access gateway" />
    <meta name="theme-color" content="#102A43" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Theme + locale bootstrap. Pinning <html class="dark"> and
      // <html lang="..."> before paint avoids FOUC and keeps screen
      // readers / CSS :lang(...) consistent with the SPA's choice.
      (function () {
        try {
          var saved = localStorage.getItem('vantyx_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          /* ignore */
        }
        try {
          var locale = localStorage.getItem('vantyx_locale');
          if (locale === 'en' || locale === 'ja') {
            document.documentElement.lang = locale;
          }
        } catch (_) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body class="min-h-screen flex flex-col font-sans">
    <div id="app" class="flex flex-col flex-1"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
