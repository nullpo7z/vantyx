# E2E テスト用: サーバーを Docker で起動し、Playwright から https://localhost:18443 でアクセスする
# 本番と同様に SQLite ファイル（e2e/test-data/e2e.db）を使用。run-e2e-with-docker.sh で毎回削除してフレッシュな DB で実行。
# 実行: ./scripts/run-e2e-with-docker.sh（推奨）または docker compose -f docker-compose.e2e.yml up -d
services:
  vantyx:
    build: .
    ports:
      - "18443:18443"   # HTTPS (E2E_BASE_URL)
      - "18080:18080"   # HTTP → HTTPS リダイレクト
    environment:
      - VANTYX_EXTERNAL_HOST=localhost
      - VANTYX_HTTPS_ADDR=:18443
      - VANTYX_HTTP_REDIRECT_ADDR=:18080
      - VANTYX_SQLITE_PATH=/app/data/e2e.db
      - VANTYX_TLS_CERT_FILE=/app/certs/tls.crt
      - VANTYX_TLS_KEY_FILE=/app/certs/tls.key
      # E2E: SSH パスワード暗号化キー。値は ./scripts/run-e2e-with-docker.sh が
      # 起動前に `openssl rand -base64 32` で動的に生成し、`VANTYX_SSH_PASSWORD_ENCRYPTION_KEY`
      # 環境変数として渡す。CI / リポジトリには静的な値を残さない（CWE-321/798）。
      - VANTYX_SSH_PASSWORD_ENCRYPTION_KEY=${VANTYX_SSH_PASSWORD_ENCRYPTION_KEY:?VANTYX_SSH_PASSWORD_ENCRYPTION_KEY must be exported (e.g. via run-e2e-with-docker.sh)}
      # E2E は各テストでログインするためレート制限を緩和
      - VANTYX_LOGIN_RATE_LIMIT_N=200
    volumes:
      - ./e2e/certs:/app/certs
      - ./e2e/test-data:/app/data
