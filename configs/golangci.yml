run:
  timeout: 10m
  issues-exit-code: 1

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - web/node_modules
    - patched_deps
  exclude-rules:
    # Tests can use long functions, less strict gosec, etc.
    # bodyclose / unparam are excluded because tests often discard
    # http.Response (e.g. websocket upgrades) and accept helper return
    # values they do not consume.
    - path: _test\.go$
      linters:
        - gocyclo
        - gosec
        - revive
        - errcheck
        - bodyclose
        - unparam
    # The tools build tag wraps blank imports only.
    - path: internal/tools/
      linters:
        - revive

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - gosec
    - gocyclo
    - revive
    - misspell
    - unparam
    - nilerr
    - bodyclose

linters-settings:
  gocyclo:
    min-complexity: 50

  revive:
    enable-all-rules: false
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "disableStutteringCheck"
      - name: package-comments
      - name: var-naming
      - name: unused-parameter
        disabled: true
      - name: error-naming
      - name: error-return
      - name: unexported-return
      - name: receiver-naming
      - name: context-as-argument

  misspell:
    locale: US
    # Accept British English spellings that appear throughout the
    # codebase comments. The doc strings use a mix of UK/US English
    # because contributors come from different backgrounds; rather than
    # rewrite every comment we whitelist the spellings.
    ignore-words:
      - vantyx
      - asciinema
      - noVNC
      - cancelled
      - cancelling
      - initialised
      - initialise
      - organised
      - organise
      - centralises
      - centralise
      - serialises
      - serialise
      - serialised
      - honoured
      - honour
      - dialling
      - sanitised
      - sanitise
      - recognised
      - recognise
      - behaviour
      - colour

  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - (net.Conn).Close
      - (*net/http.Request.Body).Close

  unparam:
    check-exported: false
