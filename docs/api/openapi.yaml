                type: string
        '400':
        '401':
        '403':
        '404':
        '502':

  /api/targets/{target_id}/files/upload:
    post:
      summary: ファイルアップロード
      description: ターゲットへファイルをアップロードします。multipart/form-data で path と file を送信。最大 64MB。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
