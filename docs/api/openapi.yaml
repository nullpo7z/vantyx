  /api/commands:
    get:
      summary: コマンドログ検索（管理者のみ）
      description: |
        ターミナルで入力された行（stdin）の一部を検索します。
        best-effort であり、シェルの編集操作等により完全なコマンド履歴とは一致しない場合があります。
        `from`/`to` 未指定時は直近 30 日。最大範囲は 90 日（超過は 400）。
        **ページネーション**: `after_id` に前ページの `next_cursor`（command_logs.id）を渡すと、より古い行を取得します。
        レスポンスは `{ "items": [...], "next_cursor": "..." }` 形式です。
      security:
        - cookieAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: line_text に対する部分一致
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: 期間開始（RFC3339 または YYYY-MM-DD）
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: 期間終了（排他的）
        - name: after_id
          in: query
          required: false
          schema:
            type: string
          description: 前ページ最終行の command_logs.id（より古い行を取得）
      responses:
        '200':
          description: コマンドログ一覧（next_cursor があれば続きあり）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandLogResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 期間パラメータ不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

