      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 発行された招待 }

  /api/vnc/sessions/{session_id}/join:
    post:
      summary: VNC 共有セッションに参加
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 参加完了 }

  /api/vnc/sessions/{session_id}/participants:
    get:
      summary: VNC 参加者一覧
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 参加者一覧 }

  /api/vnc/sessions/{session_id}/participants/{user_id}:
    delete:
      summary: VNC 参加者をキック（オーナー専用）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: キック完了 }

  /api/rdp/sessions/{session_id}/invitation-options:
    get:
      summary: ブラウザ RDP 招待候補（オーナー専用）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: ユーザー・タグ・グループ候補 }

  /api/rdp/sessions/{session_id}/invitations:
    get:
      summary: ブラウザ RDP 招待一覧（オーナー専用）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 招待一覧 }
    post:
      summary: ブラウザ RDP 招待を発行（オーナー専用）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 発行された招待 }

  /api/rdp/sessions/{session_id}/join:
    post:
      summary: ブラウザ RDP 共有セッションに参加
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 参加完了 }

  /api/rdp/sessions/{session_id}/participants:
    get:
      summary: ブラウザ RDP 参加者一覧
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 参加者一覧 }

  /api/rdp/sessions/{session_id}/participants/{user_id}:
    delete:
      summary: ブラウザ RDP 参加者をキック（オーナー専用）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: キック完了 }

  /api/terminal/sessions/{session_id}/write-requests:
    post:
      summary: 書込権限をリクエストする（観覧者）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: リクエスト作成完了 }
        '401': { description: 未認証 }
        '404': { description: セッションが存在しない・参加していない }

  /api/terminal/sessions/{session_id}/write-requests/{request_id}/grant:
    post:
      summary: 書込権限リクエストを承認し譲渡する（現 writer）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: request_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 譲渡完了 }
        '401': { description: 未認証 }
        '403': { description: 現 writer ではない }
        '404': { description: リクエストが存在しない }

  /api/terminal/sessions/{session_id}/write-requests/{request_id}/deny:
    post:
      summary: 書込権限リクエストを拒否する（現 writer）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: request_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 拒否完了 }
        '401': { description: 未認証 }
        '403': { description: 現 writer ではない }
        '404': { description: リクエストが存在しない }

  /api/terminal/sessions/{session_id}/write-token/release:
    post:
      summary: 書込権限を自発的に解放する（現 writer）
      description: |
        現 writer が任意のタイミングで書込権限を手放し、所有権をオーナー
        に戻します。所有者以外のユーザーは「希望すれば」呼べますが、現
        writer でない場合は no-op となり 403 を返します。
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 解放完了 }
        '401': { description: 未認証 }
        '403': { description: 現 writer ではない }
        '404': { description: セッションが存在しない }

  /api/file-transfers:
    get:
      summary: バックグラウンドファイル転送ジョブ一覧
      description: ログイン中のユーザーが開始した転送ジョブの一覧を返します（新しい順）。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ジョブ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTransferListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/file-transfers/download:
    post:
      summary: バックグラウンドダウンロードの開始
      description: |
        指定パスのファイルをバックグラウンドで取得します。202 でジョブを返し、完了後は GET /api/file-transfers/{transfer_id}/content でダウンロードできます。
        画面を離脱しても running フェーズはサーバー側で継続します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileTransferDownloadRequest'
      responses:
        '202':
          description: ジョブ受付
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTransferJob'
        '400':
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ターゲットが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/file-transfers/upload:
    post:
      summary: バックグラウンドアップロードの開始
      description: |
        multipart でファイルを Vantyx に受信（receiving）した後、バックグラウンドでリモートへ転送（running）します。
        receiving 中にブラウザが切断すると失敗しうる点に注意。単一ファイル上限 64MB。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - backend
                - target_id
                - path
                - file
              properties:
                backend:
                  type: string
                  enum: [remote, tftp_server]
                target_id:
                  type: string
                path:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: ジョブ受付（受信完了後 running へ）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTransferJob'
        '400':
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ステージング失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/file-transfers/{transfer_id}:
    get:
      summary: 転送ジョブの状態取得
      security:
        - cookieAuth: []
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ジョブ状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTransferJob'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ジョブが見つからない、または自分のジョブでない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: 転送ジョブのキャンセル
      security:
        - cookieAuth: []
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: キャンセル完了
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ジョブが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/file-transfers/{transfer_id}/content:
    get:
      summary: 完了したダウンロードのファイル取得
      description: direction=download かつ state=completed のジョブのみ。取得後はクライアント側でジョブ削除を推奨。
      security:
        - cookieAuth: []
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ファイル本体
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: アップロードジョブなどダウンロード以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ジョブが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 転送未完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ws/ssh:
    get:
      summary: ターミナル WebSocket（SSH / Telnet）
      description: |
        WebSocket にアップグレードされるエンドポイントです。

        **新規接続**: クエリに target_id を指定します。アップグレード後、最初のテキストメッセージで認証情報を JSON で送信してください（Telnet は username/password のみ。秘密鍵は不要）。セッションの識別用に name（セッション名）と description（説明）を任意で含められます。
        ```json
        {"username":"...","password":"...","name":"セッション名（任意）","description":"説明（任意）"}
        ```
        保存済み認証を使う場合:
        ```json
        {"use_stored_credentials":true,"password":"...（未保存時のみ）"}
        ```
        **レジューム（再接続）**: クエリに session_id を指定します（GET /api/terminal/sessions で取得）。認証情報は不要で、切断前の出力がリングバッファから再送されます。

        ユーザーはターゲットへのアクセス権が必要です。ターゲットの protocol は ssh または telnet である必要があります（vnc/rdp 等は 501）。
        認証情報が無効またはタイムアウト（15 秒）の場合は、サーバーが "error: ..." を送信し接続を閉じます。
        セッションはバックエンドで保持され、クライアント切断後もブリッジは継続します（バックグラウンド実行）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: query
          required: false
          schema:
            type: string
          description: 接続先ターゲットの ID（新規接続時必須。session_id と排他）
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: 既存セッションへの再接続（レジューム）。指定時は認証情報不要。
      responses:
        '101':
          description: WebSocket プロトコルへの切り替え
        '400':
          description: target_id 未指定、または WebSocket アップグレード失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定された target_id のターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: ターゲットのプロトコルが SSH 以外（現時点では SSH のみ対応）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ws/vnc:
    get:
      summary: VNC WebSocket（noVNC 用）
      description: |
        WebSocket にアップグレードし、protocol=vnc のターゲットの VNC サーバー（RFB）へバイト列をブリッジします。
        クライアント（noVNC 等）はバイナリフレームで RFB プロトコルを送受信します。認証情報の送信は不要（VNC サーバー側でパスワード要求時は noVNC のプロンプトで対応）。
        ユーザーはターゲットへのアクセス権が必要です。ターゲットの protocol は vnc である必要があります。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: query
          required: true
          schema:
            type: string
          description: 接続先 VNC ターゲットの ID
      responses:
        '101':
          description: WebSocket プロトコルへの切り替え。以降はバイナリ/テキストフレームで RFB を送受信。
        '400':
          description: target_id 未指定、ターゲットが VNC 以外、または WebSocket アップグレード失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定された target_id のターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/spec:
    get:
      summary: OpenAPI 仕様 (YAML)
      description: この API の OpenAPI 3.1 仕様を YAML で返します。**admin ユーザーのみ**アクセス可能。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: application/x-yaml で仕様を返す
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: admin 以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /docs:
    get:
      summary: Swagger UI
      description: API リファレンス用の Swagger UI（HTML）。**admin ユーザーのみ**アクセス可能。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: text/html で Swagger UI を返す
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: admin 以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
