      responses:
        '204':
          description: 終了完了
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: セッションが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/terminal/sessions/{session_id}:
    delete:
      summary: ターミナルセッションの終了
      description: 指定した session_id のターミナルセッションを終了します。自分のセッションのみ削除可能です。
      security:
        - cookieAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 終了完了
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: セッションが存在しない、または自分のセッションでない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/terminal/sessions/{session_id}/invitations:
    get:
      summary: 招待一覧（オーナー専用）
      description: |
        セッションオーナーが過去に発行した招待の一覧を返します。
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 招待一覧 }
        '401': { description: 未認証 }
        '404': { description: 自分のセッションでない }
    post:
      summary: 招待を発行（オーナー専用）
      description: |
        ターミナルセッションへの招待を発行します。`invitee_user_id` を
        指定すると指名招待、省略するとリンク招待となります。レスポンスの
        `token` はリンク招待時のみ意味があり、保存はされません（DB には
        SHA-256 ハッシュのみ保持）。
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [viewer, writer_eligible]
                  default: viewer
                invitee_user_id: { type: string }
                invite_tag:
                  type: string
                  description: タグに紐づく全ユーザーへ指名招待を一括発行（オーナー以外）。
                invite_group_id:
                  type: string
                  description: オーナーが所属するアクセスグループの全メンバーへ指名招待を一括発行。
                link_unlimited: { type: boolean }
                link_max_uses: { type: integer }
                ttl_seconds:
                  type: integer
                  description: 0 または未指定でデフォルト TTL。`VANTYX_INVITATION_MAX_TTL_SECONDS` が上限。
      responses:
        '200': { description: 発行された招待 }
        '400': { description: 入力エラー（モード不正、自分自身の招待など） }
        '401': { description: 未認証 }
        '404': { description: 自分のセッションでない }

  /api/terminal/sessions/{session_id}/invitations/{invitation_id}/join-url:
    post:
      summary: 招待リンクを再発行する（オーナー専用）
      description: |
        有効な招待に新しい plain token を割り当て、参加 URL を返します。
        以前の URL は直ちに無効になります。一覧取得では token は返しません。
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: invitation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 新しい参加 URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  join_url: { type: string }
                  token: { type: string }
        '401': { description: 未認証 }
        '403': { description: 失効済み / 使用済み }
        '404': { description: 招待またはセッションが見つからない }

  /api/terminal/sessions/{session_id}/invitations/{invitation_id}:
    delete:
      summary: 招待を取消す（オーナー専用）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: invitation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 取消完了 }
        '401': { description: 未認証 }
        '404': { description: 招待が存在しない }

  /api/terminal/sessions/{session_id}/join:
    post:
      summary: 招待を消費して参加する
      description: |
        招待のリンクトークンまたは招待 ID を提示して、対象セッションに
        観覧者として参加します。書込権限は自動的には付与されません。
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitation_token: { type: string, description: リンク招待時のプレーン文字列 }
                invitation_id: { type: string, description: 指名招待を直接消費する場合 }
      responses:
        '200': { description: 参加成功 }
        '400': { description: トークン未指定など }
        '401': { description: 未認証 }
        '403': { description: アクセス権無し }
        '404': { description: 招待・セッションが存在しない }

  /api/terminal/sessions/{session_id}/participants:
    get:
      summary: 参加者一覧
      description: |
        オーナー、現 writer、観覧者の一覧と保留中の書込権限リクエスト
        の状態を返します。
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 参加者リスト }
        '401': { description: 未認証 }
        '404': { description: セッションが存在しない }

  /api/terminal/sessions/{session_id}/participants/{user_id}:
    delete:
      summary: 参加者を退出させる（オーナー専用）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: キック完了 }
        '401': { description: 未認証 }
        '403': { description: オーナーでない }
        '404': { description: セッションまたは参加者が存在しない }

  /api/vnc/sessions:
    get:
      summary: アクティブな直接 VNC セッション一覧
      description: |
        ログイン中のユーザーがオーナーの稼働中 VNC セッション一覧。
        `target_id` のみで接続したあと共有 UI が `session_id` を解決するために使用します。
