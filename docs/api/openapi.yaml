      responses:
        '200': { description: ユーザー・タグ・グループ候補 }

  /api/vnc/sessions/{session_id}/invitations:
    get:
      summary: VNC 招待一覧（オーナー専用）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 招待一覧 }
    post:
      summary: VNC 招待を発行（オーナー専用）
