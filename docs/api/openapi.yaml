openapi: 3.1.0
info:
  title: Vantyx API
  version: 0.3.0
  description: |
    Vantyx バックエンドの公開 HTTP / WebSocket API 仕様。

    現時点でカバーしている機能:
    - ヘルスチェック (GET /healthz)
    - ローカルユーザー認証 (POST /api/login) と Cookie セッション
    - 自己情報取得 (GET /api/me)
    - アクセスグループの一覧・作成 (GET/POST /api/groups)。一覧は limit / after_id でキーセットページネーション対応。
    - ターゲットの一覧・作成 (GET/POST /api/targets)。一覧は limit / after_id でキーセットページネーション対応。
    - SSH WebSocket ターミナル (GET /ws/ssh)。認証後、ターゲットへの SSH をブリッジ。Phase 2 でセッション永続化・レジューム対応（切断後もブリッジ継続、GET /api/terminal/sessions で一覧、session_id で再接続）。
    - CLI SSH ゲートウェイ (Phase 2): VANTYX_SSH_LISTEN で有効化。ssh user@vantyx でログイン後、メニューからターゲット選択してプロキシ接続。
    - OpenAPI 仕様 (GET /api/spec) と Swagger UI (GET /docs) は admin のみアクセス可。
    エラー応答はすべて application/json の ErrorResponse (message) で統一しています。
servers:
  # Swagger UI の Try it out を「アクセスしているオリジン」に合わせるため、相対 URL を優先します。
  # 例: https://<server-ip>/docs を開いた場合、/api/login は https://<server-ip>/api/login へ送信されます。
  - url: /
    description: "同一オリジン（推奨: https://<server-host>/）"
  - url: https://localhost:8443
    description: "ローカル開発用 HTTPS（go run: :8443）"
  - url: http://localhost:8080
    description: ローカル開発用 HTTP（常に HTTPS へ 301 リダイレクト）

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vantyx_session
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
        username:
          type: string
      required:
        - user_id
        - username
    Target:
      type: object
      description: 接続先ターゲット（サーバー）の情報。
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
          description: "階層管理用のフォルダパス（例: prod/network）。空の場合はルート。"
        host:
          type: string
          description: 接続先ホスト名または IP アドレス
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: ["ssh", "telnet"]
      required:
        - id
        - name
        - host
        - port
        - protocol
    AccessGroup:
      type: object
      description: アクセスグループ。ユーザーが所属し、ターゲットを紐づける単位。
      properties:
        id:
          type: string
          description: "階層を含むアクセスグループID（例: prod/network）"
        name:
          type: string
          description: 表示名
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
      required:
        - id
        - name
        - targets
    GroupListResponse:
      type: object
      description: limit または after_id 指定時のグループ一覧応答（キーセットページネーション）。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessGroup'
        next_cursor:
          type: string
          description: 次のページを取得する際に after_id に渡す値。存在しない場合は省略。
    TargetListResponse:
      type: object
      description: limit または after_id 指定時のターゲット一覧応答（キーセットページネーション）。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Target'
        next_cursor:
          type: string
          description: 次のページを取得する際に after_id に渡す値。存在しない場合は省略。
    TerminalSessionItem:
      type: object
      description: アクティブなターミナルセッション 1 件（レジューム用）。
      properties:
        session_id:
          type: string
          description: セッション ID。GET /ws/ssh?session_id={id} で再接続（認証情報不要）。
        target_id:
          type: string
        target_name:
          type: string
        name:
          type: string
          description: セッション名（識別用・任意）。接続時の最初の JSON で name を送信可能。
        description:
          type: string
          description: 説明（任意）。接続時の最初の JSON で description を送信可能。
        created_at:
          type: string
          format: date-time
      required:
        - session_id
        - target_id
        - target_name
        - created_at
    TerminalSessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TerminalSessionItem'

paths:
  /healthz:
    get:
      summary: ヘルスチェック
      description: アプリケーションが稼働しているかを確認するためのシンプルなヘルスチェックエンドポイント。
      responses:
        '200':
          description: 正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/login:
    post:
      summary: ログイン
      description: ユーザー名とパスワードでログインし、`vantyx_session` Cookie を発行します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功
          headers:
            Set-Cookie:
              description: vantyx_session を含む Set-Cookie ヘッダ
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: リクエストボディ不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: セッション作成失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      summary: 自分自身のユーザー情報取得
      description: 現在のセッションに紐づくユーザー情報を返します。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets:
    get:
      summary: アクセス可能なターゲット一覧
      description: |
        ログイン中のユーザーがアクセス権を持つターゲット一覧を返します。
        **ページネーション**: クエリに limit または after_id を指定すると、レスポンスは `{ "items": [...], "next_cursor": "..." }` 形式になります。
        next_cursor が含まれる場合は、次リクエストで `after_id={next_cursor}` を付けて続きを取得します。limit 未指定時は 100、最大 1000。
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: 取得件数。指定時はキーセットページネーションになり、レスポンスは items/next_cursor 形式。
        - name: after_id
          in: query
          required: false
          schema:
            type: string
          description: この ID より大きいターゲットから取得（キーセット）。limit と組み合わせて使用。
      responses:
        '200':
          description: ターゲット一覧。limit/after_id 未指定時は配列、指定時は TargetListResponse。
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Target'
                  - $ref: '#/components/schemas/TargetListResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: ターゲット（サーバー）の追加
      description: 認証済みユーザーが新しいターゲットを追加し、指定したアクセスグループに紐づけます（ユーザーはそのグループに所属している必要があります）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 表示名
                group_id:
                  type: string
                  description: 紐づけ先のアクセスグループID
                path:
                  type: string
                  description: 任意のフォルダパス。省略時は group_id が利用されます（UI のグルーピング用途）。
                host:
                  type: string
                  description: ホスト名または IP
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 22
                protocol:
                  type: string
                  enum: ["ssh", "telnet"]
                  default: ssh
                ssh_username:
                  type: string
                  description: SSH ログイン用ユーザー名（任意）。保存すると接続時に利用可能。
                ssh_password:
                  type: string
                  description: SSH パスワード（任意）。保存時は AES-256-GCM で暗号化（OWASP ASVS L2）。鍵未設定時は 503 を返す。
              required:
                - name
                - group_id
                - host
      responses:
        '201':
          description: 作成されたターゲット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: リクエスト不正（name/host 不足、protocol 不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定グループに所属していない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: group_id が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SSH パスワードを保存するが暗号化鍵が未設定（VANTYX_SSH_PASSWORD_ENCRYPTION_KEY）。OWASP ASVS L2 準拠のため、パスワード保存時は鍵必須。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ターゲット作成またはグループ紐づけの内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/groups:
    get:
      summary: アクセスグループ一覧（所属 + ターゲット含む）
      description: |
        ログイン中のユーザーが所属するアクセスグループ一覧を返します。各グループには紐づくターゲット一覧が含まれます。
        **ページネーション**: クエリに limit または after_id を指定すると、レスポンスは `{ "items": [...], "next_cursor": "..." }` 形式になります。
        next_cursor が含まれる場合は、次リクエストで `after_id={next_cursor}` を付けて続きを取得します。limit 未指定時は 100、最大 1000。
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: 取得件数。指定時はキーセットページネーションになり、レスポンスは items/next_cursor 形式。
        - name: after_id
          in: query
          required: false
          schema:
            type: string
          description: この ID より大きいグループから取得（キーセット）。limit と組み合わせて使用。
      responses:
        '200':
          description: アクセスグループ一覧。limit/after_id 未指定時は配列、指定時は GroupListResponse。
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/AccessGroup'
                  - $ref: '#/components/schemas/GroupListResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: アクセスグループの追加
      description: 新しいアクセスグループを作成し、作成者をそのグループに追加します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                path:
                  type: string
                  description: "階層プレフィックス（例: prod）。省略可。"
              required:
                - name
      responses:
        '201':
          description: 作成されたアクセスグループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
        '400':
          description: リクエスト不正（name 不足、invalid request body など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: グループ作成の内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/terminal/sessions:
    get:
      summary: アクティブなターミナルセッション一覧
      description: |
        ログイン中のユーザーに属するアクティブなターミナルセッション一覧を返します。
        レジューム時は、返却された session_id を GET /ws/ssh?session_id={id} に渡して再接続します（認証情報の再送不要）。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: セッション一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSessionListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ws/ssh:
    get:
      summary: SSH WebSocket ターミナル
      description: |
        WebSocket にアップグレードされるエンドポイントです。

        **新規接続**: クエリに target_id を指定します。アップグレード後、最初のテキストメッセージでターゲット SSH 用の認証情報を JSON で送信してください。セッションの識別用に name（セッション名）と description（説明）を任意で含められます。
        ```json
        {"username":"...","password":"...","name":"セッション名（任意）","description":"説明（任意）"}
        ```
        **レジューム（再接続）**: クエリに session_id を指定します（GET /api/terminal/sessions で取得）。認証情報は不要で、切断前の出力がリングバッファから再送されます。

        ユーザーはターゲットへのアクセス権が必要です。ターゲットの protocol は ssh である必要があります（telnet の場合は 501）。
        認証情報が無効またはタイムアウト（15 秒）の場合は、サーバーが "error: ..." を送信し接続を閉じます。
        セッションはバックエンドで保持され、クライアント切断後もブリッジは継続します（バックグラウンド実行）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: query
          required: false
          schema:
            type: string
          description: 接続先ターゲットの ID（新規接続時必須。session_id と排他）
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: 既存セッションへの再接続（レジューム）。指定時は認証情報不要。
      responses:
        '101':
          description: WebSocket プロトコルへの切り替え
        '400':
          description: target_id 未指定、または WebSocket アップグレード失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定された target_id のターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: ターゲットのプロトコルが SSH 以外（現時点では SSH のみ対応）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/spec:
    get:
      summary: OpenAPI 仕様 (YAML)
      description: この API の OpenAPI 3.1 仕様を YAML で返します。**admin ユーザーのみ**アクセス可能。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: application/x-yaml で仕様を返す
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: admin 以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /docs:
    get:
      summary: Swagger UI
      description: API リファレンス用の Swagger UI（HTML）。**admin ユーザーのみ**アクセス可能。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: text/html で Swagger UI を返す
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: admin 以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
