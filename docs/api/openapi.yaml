              type: object
              properties:
                name:
                  type: string
                path:
                  type: string
                  description: "階層プレフィックス（例: prod）。省略可。"
              required:
                - name
      responses:
        '201':
          description: 作成されたアクセスグループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
        '400':
          description: リクエスト不正（name 不足、invalid request body など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: グループ作成の内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

