      responses:
        '200':
          description: セッション一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSessionListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rdp/sessions:
    get:
      summary: アクティブな RDP セッション一覧
      description: |
        ログイン中のユーザーに属するアクティブな RDP（ブラウザ）セッション一覧を返します。
        last_seen は VNC 経由の操作・画面更新で更新されます。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: セッション一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RDPSessionListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
