run:
  timeout: 10m
  issues-exit-code: 1

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - web/node_modules
    - patched_deps
  exclude-rules:
    # Tests can use long functions, less strict gosec, etc.
    # bodyclose is excluded because tests often discard http.Response
    # (e.g. websocket upgrades) explicitly on purpose.
    - path: _test\.go$
      linters:
        - gosec
        - errcheck
        - bodyclose

linters:
  # Personal-OSS minimal set: stdlib correctness + a security tool +
  # cheap typo checks. Heavier opinionated linters (revive godoc
  # requirements, gocyclo, unparam, nilerr) are intentionally off.
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - gosec
    - misspell
    - bodyclose

linters-settings:
  misspell:
    locale: US
    # Accept British English spellings that appear throughout the
    # codebase comments. The doc strings use a mix of UK/US English
    # because contributors come from different backgrounds; rather than
    # rewrite every comment we whitelist the spellings.
    ignore-words:
      - vantyx
      - asciinema
      - noVNC
      - cancelled
      - cancelling
      - initialised
      - initialise
      - organised
      - organise
      - centralises
      - centralise
      - serialises
      - serialise
      - serialised
      - honoured
      - honour
      - dialling
      - sanitised
      - sanitise
      - recognised
      - recognise
      - behaviour
      - colour

  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - (net.Conn).Close
      - (*net/http.Request.Body).Close
