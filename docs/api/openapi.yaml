  /docs:
    get:
      summary: Swagger UI
      description: API リファレンス用の Swagger UI（HTML）。**admin ユーザーのみ**アクセス可能。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: text/html で Swagger UI を返す
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: admin 以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
