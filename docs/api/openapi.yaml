  /api/recordings:
    get:
      summary: 録画メタデータ一覧
      description: |
        ログイン中のユーザーに属する録画のメタデータ一覧を返します。ファイルパスは含まれません。
        クエリ target_id を指定すると、そのターゲット（サーバー）に紐づく録画のみに絞り込みます。
        `from`/`to` で started_at を期間絞り込み（未指定時は直近 30 日、最大 90 日）。
        `channel_type`（browser / cli 等）、`session_id`（完全一致）でさらに絞り込み可能。
        管理者は `user_id` を指定して他ユーザーの録画を参照できます（非管理者が指定した場合は 403）。
        ブラウザターミナルおよび CLI（ssh）接続の両方が録画対象です（VANTYX_RECORDINGS_DIR 設定時）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: query
          required: false
          schema:
            type: string
          description: このターゲットに紐づく録画のみ返す（省略時は全件、最大 200 件）
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: started_at の期間開始
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: started_at の期間終了（排他的）
        - name: channel_type
          in: query
          required: false
          schema:
            type: string
          description: チャネル種別（browser / cli 等）
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: セッション ID（完全一致）
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: 録画所有者（管理者のみ。未指定時は自分の録画のみ）
      responses:
        '200':
          description: 録画一覧（items 配列）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 非管理者が user_id を指定した場合など
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 期間パラメータ不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/recordings/{recording_id}/file:
    get:
      summary: 録画ファイルの取得
      description: |
        指定した録画のファイルを返します。クエリ format で形式を指定します。
        - **cast**（省略時）: Asciinema v2 形式（.cast）。asciinema-player で再生可能。
        - **gif**: GIF アニメーション。agg がサーバーにインストールされている必要があります。未導入時 503。
        - **webm**: WebM 動画。agg と ffmpeg が必要。未導入時 503。
      security:
        - cookieAuth: []
      parameters:
        - name: recording_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [cast, gif, webm]
            default: cast
      responses:
        '200':
          description: 録画ファイル（Content-Type は形式に応じて application/json / image/gif / video/webm 等）
          headers:
            Content-Disposition:
              description: ダウンロード時のファイル名
              schema:
                type: string
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 録画が存在しない、または自分の録画でない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 録画未設定（VANTYX_RECORDINGS_DIR）または gif/webm 用の agg/ffmpeg 未導入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

