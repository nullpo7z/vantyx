  /api/targets:
    get:
      summary: アクセス可能なターゲット一覧
      description: |
        ログイン中のユーザーがアクセス権を持つターゲット一覧を返します。
        **ページネーション**: クエリに limit または after_id を指定すると、レスポンスは `{ "items": [...], "next_cursor": "..." }` 形式になります。
        next_cursor が含まれる場合は、次リクエストで `after_id={next_cursor}` を付けて続きを取得します。limit 未指定時は 100、最大 1000。
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: 取得件数。指定時はキーセットページネーションになり、レスポンスは items/next_cursor 形式。
        - name: after_id
          in: query
          required: false
          schema:
            type: string
          description: この ID より大きいターゲットから取得（キーセット）。limit と組み合わせて使用。
      responses:
        '200':
          description: ターゲット一覧。limit/after_id 未指定時は配列、指定時は TargetListResponse。
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Target'
                  - $ref: '#/components/schemas/TargetListResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: ターゲット（サーバー）の追加
      description: 管理者が新しいターゲットを追加し、指定したアクセスグループに紐づけます。`credential_identity_id` と `ssh_key_id` は同時に指定できません。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 表示名
                group_id:
                  type: string
                  description: 紐づけ先のアクセスグループID
                path:
                  type: string
                  description: 任意のフォルダパス。省略時は group_id が利用されます（UI のグルーピング用途）。
                host:
                  type: string
                  description: ホスト名または IP
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 22
                protocol:
                  type: string
                  enum: ["ssh", "telnet", "vnc", "rdp", "ftp", "tftp"]
                  default: ssh
                credential_identity_id:
                  type: string
                  description: 指定時、Identity からユーザー名・パスワード・鍵をコピー（リクエストの非空フィールドが優先）。
                ssh_key_id:
                  type: string
                  description: 指定時、Key から秘密鍵をコピー。ssh_username はリクエストで必須。
                ssh_username:
                  type: string
                  description: SSH ログイン用ユーザー名（任意）。保存すると接続時に利用可能。
                ssh_password:
                  type: string
                  description: SSH パスワード（任意）。保存時は AES-256-GCM で暗号化（OWASP ASVS L2）。鍵未設定時は 503 を返す。
                ssh_private_key:
                  type: string
                  description: PEM 秘密鍵（手入力モード）
                ssh_private_key_passphrase:
                  type: string
                ssh_host_key_fingerprint:
                  type: string
                  description: 初回登録時に期待する SSH ホストキー SHA256 フィンガープリント
                sftp_enabled:
                  type: boolean
                ftp_enabled:
                  type: boolean
                tftp_enabled:
                  type: boolean
              required:
                - name
                - group_id
                - host
      responses:
        '201':
          description: 作成されたターゲット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: リクエスト不正（name/host 不足、protocol 不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証またはセッション無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 指定グループに所属していない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: group_id が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SSH パスワードを保存するが暗号化鍵が未設定（VANTYX_SSH_PASSWORD_ENCRYPTION_KEY）。OWASP ASVS L2 準拠のため、パスワード保存時は鍵必須。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ターゲット作成またはグループ紐づけの内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets/{target_id}:
    put:
      summary: ターゲット（ホスト）の更新
      description: |
        認証済みユーザーが、アクセス権のあるターゲットの名前・ホスト・ポート・プロトコル・パス・SSH認証情報を更新します。target_id は変更されません。
        group_id を指定すると、ターゲットの所属アクセスグループも変更します（省略時は変更なし）。移動先グループは
        実在し、かつ操作者自身がそのグループへのアクセス権を持っている必要があります（作成時と同じ制約）。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
          description: 更新するターゲットの ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 22
                protocol:
                  type: string
                  enum: ["ssh", "telnet", "vnc", "rdp", "ftp", "tftp"]
                  default: ssh
                path:
                  type: string
                group_id:
                  type: string
                  description: 省略で変更なし。指定する場合は空文字不可（実在するグループで、かつ操作者自身がアクセス権を持つこと）。
                credential_identity_id:
                  type: string
                ssh_key_id:
                  type: string
                ssh_username:
                  type: string
                ssh_password:
                  type: string
                  description: 省略で変更なし。空文字でクリア。非空で暗号化保存（鍵必須）。
                ssh_private_key:
                  type: string
                  description: 省略で変更なし。空文字でクリア。
                ssh_private_key_passphrase:
                  type: string
                sftp_enabled:
                  type: boolean
                ftp_enabled:
                  type: boolean
                tftp_enabled:
                  type: boolean
              required:
                - name
                - host
      responses:
        '200':
          description: 更新後のターゲット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当該ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SSH パスワード保存時は暗号化鍵必須
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 更新失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: ターゲット（ホスト）の削除
      description: 認証済みユーザーが、アクセス権のあるターゲットを削除します。グループとの紐づけも削除されます。
      security:
        - cookieAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除完了
        '400':
          description: target_id 不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当該ターゲットへのアクセス権なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ターゲットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 削除失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/targets/{target_id}/tags:
    get:
      summary: ターゲットのタグ一覧
