        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked_at:
                    type: string
                    format: date-time
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        host:
                          type: string
                        port:
                          type: integer
                        reachable:
                          type: boolean
                        latency_ms:
                          type: integer
                        error:
                          type: string

