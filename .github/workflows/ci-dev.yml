name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main", "dev"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: |
          golangci-lint run --config=./configs/golangci.yml --issues-exit-code=1
      - name: Go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Run gofmt."
            exit 1
          fi

  lint-fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        if: hashFiles('web/package-lock.json') != ''
        run: |
          cd web
          npm ci
      - name: Lint frontend
        if: hashFiles('web/package.json') != ''
        run: |
          cd web
          npm run lint -- --max-warnings=0
      - name: Prettier check
        if: hashFiles('web/.prettierrc*') != ''
        run: |
          cd web
          npx --yes prettier --check 'src/**/*.{js,ts,jsx,tsx,css,html}'
      - name: Typecheck frontend
        if: hashFiles('web/tsconfig.json') != ''
        run: |
          cd web
          npx tsc --noEmit

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Only fail on broken links inside the repository's Markdown
          # tree; external links are reported but not fatal so a flaky
          # third-party site cannot block CI.
          args: >-
            --no-progress
            --offline
            --include-fragments
            './**/*.md'
          fail: true

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Run tests
        run: |
          go test ./...
      - name: Run coverage for internal packages
        run: |
          go test ./internal/access ./internal/auth ./internal/httpapi ./internal/netutil ./internal/session ./internal/sshproxy -covermode=atomic -coverprofile=coverage.out
      - name: Enforce coverage threshold
        run: |
          chmod +x scripts/check_coverage.sh
          ./scripts/check_coverage.sh coverage.out 78

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run gosec
        run: gosec -exclude=G703,G304,G706,G104 ./...

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint-go, lint-fe, test-go, security-scan]
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t vantyx:ci .
