name: Release

# Cutting a release = pushing a `vX.Y.Z` tag that points at a commit on
# `main` (which only gets there through a CI-gated pull request). This
# workflow then:
#   1. refuses tags that are not on main;
#   2. builds the image once and pushes it to Docker Hub as
#      nullpo7z/vantyx:latest, :vX.Y.Z and :<short-sha>;
#   3. creates the GitHub Release with the matching CHANGELOG section.
#
# Nothing is ever pushed to Docker Hub from a developer machine; this is
# the only publisher (see CLAUDE.md). Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: nullpo7z/vantyx

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Merge via pull request first, then tag main."
            exit 1
          fi
      - name: Tag must have a CHANGELOG section
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$v]' section"; exit 1; }
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.verify.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Vantyx
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the published image (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
          severity: "HIGH,CRITICAL"
          ignore-unfixed: "true"
          exit-code: "0"

  github-release:
    needs: [verify, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract the CHANGELOG section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## \[/ { if (found) exit; if ($0 ~ "^## \\[" v "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          { echo; echo "Docker image: \`docker pull ${IMAGE}:${GITHUB_REF_NAME}\` (also \`:latest\`, \`:${GITHUB_SHA::7}\`)"; } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
