name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main", "dev"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Run gofmt."
            exit 1
          fi
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a known-good v2 release; "latest" can break CI when
          # upstream cuts a new major (e.g. v1 -> v2 broke the schema).
          version: v2.12.2
          # Build the linter with the runner's Go toolchain so it
          # matches the language version targeted by go.mod (the
          # prebuilt binary lags upstream Go releases).
          install-mode: goinstall
          args: --config=./configs/golangci.yml --issues-exit-code=1

  lint-fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        if: hashFiles('web/package-lock.json') != ''
        run: |
          cd web
          npm ci
      - name: Lint frontend
        if: hashFiles('web/package.json') != ''
        run: |
          cd web
          npm run lint -- --max-warnings=0
      - name: Prettier check
        if: hashFiles('web/.prettierrc*') != ''
        run: |
          cd web
          npx --yes prettier --check 'src/**/*.{js,ts,jsx,tsx,css,html}'
      - name: Typecheck frontend
        if: hashFiles('web/tsconfig.json') != ''
        run: |
          cd web
          npx tsc --noEmit

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: Run tests
        run: |
          go test ./... -timeout 10m
      - name: Compute coverage (informational)
        run: |
          go test ./internal/access ./internal/auth ./internal/httpapi ./internal/netutil ./internal/session ./internal/sshproxy -covermode=atomic -coverprofile=coverage.out
          echo "Coverage summary (informational, not a CI gate):"
          go tool cover -func=coverage.out | tail -1
